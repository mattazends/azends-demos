<style>
:root{--ink:#16181A;--ink2:#2A2D30;--muted:#73777B;--line:#E7E5E1;--card:#fff;--sheet:#FBFAF8;--amber:#DB7B2E;--amber2:#F3E3D2;--good:#2F6B4A;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#C9D6DF}
body{font-family:var(--f);color:var(--ink);font-size:15px}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;border:0;background:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.brand span{font-weight:300;opacity:.7}

.rb:active{transform:scale(.93)}.rb svg{width:22px;height:22px}.rb[aria-pressed="true"]{background:var(--ink);color:#fff}
.rb span{position:absolute;right:58px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;background:rgba(22,24,26,.86);color:#fff;padding:5px 9px;border-radius:9px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}

.tagL,.tagR{position:absolute;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:9px;color:#fff;white-space:nowrap}
.tagL{right:12px;background:#9A3B2A}.tagR{left:12px;background:var(--good)}

.grab{display:flex;justify-content:center;padding:9px 0 4px;cursor:pointer}.grab i{width:42px;height:5px;border-radius:3px;background:#D3D0CA}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}

.tab[aria-selected="true"]{background:var(--ink);color:#fff}.tab.cta{background:var(--amber);color:#fff}
.tab b{width:6px;height:6px;border-radius:50%;background:var(--amber)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:4px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 2px 8px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 10px;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}
.tile{flex:none;width:104px;scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile .sw{width:104px;height:104px;border-radius:18px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;transition:transform .15s}
.tile[aria-pressed="true"] .sw{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}

.tile:active .sw{transform:scale(.96)}
.tile b{font-size:13px;font-weight:600;letter-spacing:-.01em;line-height:1.2}.tile small{font-size:11.5px;color:var(--muted);margin-top:-4px}
.tile.wide{width:148px}.tile.wide .sw{width:148px;height:96px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.size{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:5px;transition:border-color .2s}
.size[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.size svg{width:44px;height:30px}.size b{font-size:14px;font-weight:600}.size small{font-size:11.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 14px 0 10px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:8px;transition:border-color .2s,background .2s}

.chip[aria-pressed="true"] i::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.chip em{font-style:normal;color:var(--muted);font-size:12px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:10px 2px 0}
.qsum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13.5px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.qsum span{color:var(--muted)}.qsum strong{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.qtotal{display:flex;justify-content:space-between;align-items:end;margin:12px 0 4px;padding:14px;border-radius:16px;background:var(--ink);color:#fff}
.qtotal small{opacity:.65;font-size:12px;display:block}.qtotal b{font-size:28px;font-weight:600;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.qtotal .mo{text-align:right;font-size:13px;opacity:.85}

.go{height:54px;border-radius:16px;background:var(--amber);color:#fff;font-weight:600;font-size:16px;width:100%;margin-top:4px;transition:transform .12s}.go:active{transform:scale(.98)}

.done{text-align:center;padding:8px 0}.done .tk{width:58px;height:58px;border-radius:50%;background:var(--good);margin:0 auto 10px;display:grid;place-items:center}

.toast.off{opacity:0;transform:translate(-50%,-6px)}
.loading{position:fixed;inset:0;z-index:9;background:#C9D6DF;display:grid;place-items:center;color:#4b5560;font-weight:500;font-size:13px;transition:opacity .7s}.loading.off{opacity:0;pointer-events:none}
.loading span::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid #b2c1cb;border-top-color:var(--amber);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

</style>

  <button class="rb" id="bView" aria-label="Reset view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span>Reset view</span></button>
</div>
<div id="split" hidden><div class="tagL">Before</div><div class="tagR">After</div><div id="knob"><svg viewBox="0 0 24 24" fill="none" stroke="#16181A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></div></div>
<div class="toast off" id="toast"></div>
<section id="sheet">

  <div class="shead"><h2 id="stitle"></h2><p id="ssub"></p></div>

<div class="loading" id="loading"><span>Building your driveway</span></div>

  else{const before=split>=.999;oldG.visible=before;newG.visible=!before;renderer.render(scene,camera)}}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!renderer||document.hidden||!newG)return;let anim=false;
  if(tween){const q=Math.min(1,(now-tween.s)/tween.d),e=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;camera.position.lerpVectors(tween.fp,tween.tp,e);controls.target.lerpVectors(tween.ft,tween.tt,e);if(q>=1)tween=null;anim=true}
  else if(!touched&&!carAnim){const c=CAMS.wide,a=Math.sin((now-t0)/1000*.22)*.22;const v=new THREE.Vector3(...c.p).sub(new THREE.Vector3(...c.t));v.applyAxisAngle(new THREE.Vector3(0,1,0),a);camera.position.copy(v.add(new THREE.Vector3(...c.t)));controls.target.set(...c.t);anim=true}
  if(wipe){const q=Math.min(1,(now-wipe.s)/wipe.d),e=q<.5?4*q*q*q:1-Math.pow(-2*q+2,3)/2;split=wipe.a+(wipe.b-wipe.a)*e;placeSplit();if(q>=1){wipe=null;if(!compare)$('split').hidden=true}anim=true}

    const p=ca.path.getPointAt(u),tg=ca.path.getTangentAt(u);c.position.copy(p);c.rotation.y=Math.atan2(-tg.x,-tg.z);c.visible=true;c.userData.wheels.forEach(w=>w.rotation.x-=dt*8*(1-Math.abs(e-.5)*1.4));

  case 'planting':return `${S.size!=='full'?`<div class="carousel">${PLANT.map(p=>tile('plant',p.id,p.name,gbp(p.p),plantSW[p.id](),S.plant===p.id)).join('')}</div>`:''}<div class="chips">${PLANT_X.map(p=>chip('plantx',p.id,p.name,p.p,S.plantx.has(p.id))).join('')}</div>`;
  case 'extras':return `<div class="chips">${EXTRAS.filter(e=>e.id!=='electric').map(e=>chip('extras',e.id,e.name,e.p,S.extras.has(e.id))).join('')}</div><p class="note">A dropped kerb needs council approval. We handle the application.</p>`;
  case 'quote':{if(quoteDone)return `<div class="done"><div class="tk"><svg viewBox="0 0 24 24" width="28" height="28"><path d="M6 12.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>Thanks ${sentName}, it's saved</h3><p>A surveyor would now text you to book a free measure, with your design and fixed price attached.</p><p style="font-size:12.5px">This is a demo, so nothing has been sent.</p></div>`;
    const t=total(),c=colOf();const rows=[['Size',find(SIZES,S.size).name+' · '+find(SIZES,S.size).m2+'m²'],['Surface',find(SURF,S.surf).name+', '+c.name+(S.surf==='block'?', '+find(PATTERNS,S.pattern).name:'')],['Border',find(BORDERS,S.border).name],
      ...(S.size!=='full'?[['Path',find(PATHS,S.path).name]]:[]),['Boundary',find(WALLS,S.wall).name+(S.wall!=='open'&&S.gate!=='nogate'?' + '+find(GATES,S.gate).name.toLowerCase()+' gates':'')],['Lighting',[...S.lights].map(id=>find(LIGHTS,id).name).join(', ')||'None'],['Extras',[...S.extras].map(id=>find(EXTRAS,id).name).join(', ')||'None']];
    return `<div class="qsum">${rows.map(([a,b])=>`<span>${a}</span><strong>${b}</strong>`).join('')}</div><div class="qtotal"><div><small>Fixed price, laid and finished</small><b>${gbp(t)}</b></div><div class="mo">or ${gbp(Math.round(t*1.1/36))}/mo<br><small>over 36 months</small></div></div>
      <form novalidate id="lead"><input id="f-name" autocomplete="name" placeholder="Your name" aria-label="Your name"><input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Mobile number" aria-label="Mobile number"><input id="f-pc" autocomplete="postal-code" placeholder="Postcode" aria-label="Postcode" style="text-transform:uppercase">
      <p class="err" id="err"></p><button class="go" type="submit">Book my free measure</button></form>`}}}
function renderSheet(){$('tabs').innerHTML=tabsHTML();$('stitle').textContent=(TABS.find(t=>t[0]===tab)||[])[1]==='Get price'?'Your driveway':(TABS.find(t=>t[0]===tab)||[])[1];$('ssub').textContent=SUBS[tab];$('sbody').innerHTML=bodyHTML();$('sbody').scrollTop=0;
  const on=$('tabs').querySelector('[aria-selected="true"]');on&&on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  const f=$('lead');if(f)f.addEventListener('submit',submit)}
function submit(e){e.preventDefault();const n=$('f-name'),ph=$('f-phone'),pc=$('f-pc');[n,ph,pc].forEach(i=>i.classList.remove('bad'));let msg='';
  if(!/^\+?[\d\s]{10,14}$/.test(ph.value.trim())){ph.classList.add('bad');msg='Add a UK mobile so we can text you.'}if(pc.value.trim().length<5){pc.classList.add('bad');msg=msg||'Add your postcode so we know you are local.'}
  if(n.value.trim().length<2){n.classList.add('bad');msg='Add your name so we know who to ask for.'}$('err').textContent=msg;if(msg)return;sentName=n.value.trim().split(' ')[0];quoteDone=true;renderSheet()}
function setTab(t){tab=t;$('sheet').classList.remove('min');renderSheet();setTimeout(()=>{resize();placeSplit()},460);if(!carAnim)flyTo(tabCam[t])}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){buzz();setTab(b.dataset.tab)}});
$('sbody').addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-t]');if(!b||b.disabled)return;buzz();
  if(b.dataset.k){const k=b.dataset.k,v=b.dataset.v;if(k==='col')S.col[S.surf]=v;else S[k]=v;
    if(k==='surf'&&tab==='surface'){}b.parentElement.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(k==='surf'||k==='size'||k==='wall'||k==='border'||k==='pattern'){const keep=tab;setTimeout(()=>{$('tabs').innerHTML=tabsHTML()},0)}}
  else{const set=S[b.dataset.t],v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.setAttribute('aria-pressed',set.has(v));if(b.dataset.t==='lights'&&set.has(v)&&!moodT)toast('Tap the moon to see them at night')}
  buildNew();specLine()});
$('grab').addEventListener('click',()=>{$('sheet').classList.toggle('min');setTimeout(()=>{resize();placeSplit()},460)});
function specLine(){}
let tt;function toast(m,ms=2000){const t=$('toast');t.textContent=m;t.classList.remove('off');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('off'),ms)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
$('bCompare').addEventListener('click',()=>{buzz();setCompare(!compare);if(compare)flyTo('wide')});
$('bMood').addEventListener('click',e=>{buzz();moodT=moodT?0:1;e.currentTarget.setAttribute('aria-pressed',!!moodT)});
$('bView').addEventListener('click',()=>{buzz();flyTo('wide')});
$('bCar').addEventListener('click',()=>{buzz();if(compare)setCompare(false);const hasG=R.gates.length>0;gateT=hasG?1:0;carAnim={t:0,wait:hasG?1.1:.1,d:6.5,path:carPath()};flyTo('car');toast(hasG?'Gates opening…':'Here it comes',1600)});
canvas.addEventListener('pointerdown',()=>{if(!touched){touched=true;$('rail').classList.remove('hint')}tween=null});
setTimeout(()=>$('rail').classList.remove('hint'),5200);

/* ===================== START ===================== */
if(scene){buildHouse();buildStreet();buildOld();buildNew();resize();flyTo('wide',true);renderSheet();
  split=.999;requestAnimationFrame(loop);setTimeout(()=>{$('loading').classList.add('off')},300);
  setTimeout(()=>{$('split').hidden=false;placeSplit();wipe={a:.999,b:0,s:performance.now(),d:2600}},1300);
  setTimeout(()=>{toast('Before → after. Tap the split button to compare',2800)},4000)}
else renderSheet();
</script>
</body>
