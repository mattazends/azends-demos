<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Arbor and Stone Garden Designer</title>
<meta name="theme-color" content="#F1F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--paper:#F1F1EC;--card:#fff;--ink:#141816;--muted:#686C68;--line:#E0DED6;--accent:#2F4A33;--soft:#E6ECE4;--warm:#B88A4A;
  --f:'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);overflow:hidden;font-size:15px;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-width:560px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 9px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}.brand svg{width:24px;height:24px}.brand span{font-weight:300;color:var(--muted)}
.stepno{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.segs i{height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}.segs i.on::after{transform:scaleX(1)}
.preview{position:relative;height:50vh;min-height:280px;border-radius:24px;overflow:hidden;background:#C6D6E0;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -24px rgba(20,30,24,.6);touch-action:none}
#c{display:block;width:100%;height:100%}
.ov-top{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;pointer-events:none;align-items:center}
.spec{font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:#B4432F;color:#fff;transition:opacity .4s;flex:none}
.badge.after{background:var(--accent)}
.toast{position:absolute;left:50%;top:50px;transform:translateX(-50%);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;white-space:nowrap;background:rgba(20,24,22,.84);color:#fff;pointer-events:none;transition:opacity .45s,transform .45s;display:flex;gap:7px;align-items:center}
.toast.off{opacity:0;transform:translate(-50%,-6px)}.toast svg{width:15px;height:15px}
.fx{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px}
.fxb{height:42px;padding:0 13px 0 11px;border-radius:999px;border:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);transition:background .3s,color .3s,transform .12s;white-space:nowrap}
.fxb:active{transform:scale(.95)}.fxb svg{width:17px;height:17px;flex:none}.fxb[aria-pressed="true"]{background:var(--ink);color:#fff}
.fxb.go{background:var(--accent);color:#fff;margin-left:auto}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#C6D6E0;transition:opacity .7s;font-weight:500;color:var(--muted);font-size:13px}.loading.off{opacity:0;pointer-events:none}
.loading span::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid #b1c2cc;border-top-color:var(--accent);animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.panel{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:16px 18px;margin-inline:-4px;padding-inline:4px}
.enter-f{animation:inF .4s cubic-bezier(.2,.8,.2,1)}.enter-b{animation:inB .4s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}@keyframes inB{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.04;letter-spacing:-.045em;font-weight:300;margin:2px 0 10px;text-wrap:balance}h1 b,h2 b{font-weight:700}
h2{font-size:22px;letter-spacing:-.035em;font-weight:300;margin:0 0 4px}.lede{color:var(--muted);line-height:1.5;margin:0 0 14px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--accent)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:6px 6px 10px;text-align:center;display:flex;flex-direction:column;gap:7px;transition:border-color .2s,box-shadow .2s,transform .12s}
.opt:active,.row:active{transform:scale(.97)}.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.opt b{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.2;padding:0 4px}.opt .pp{font-size:12px;color:var(--muted);font-weight:500;margin-top:-3px}
.img{height:70px;border-radius:12px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;min-height:66px;width:100%;text-align:left;transition:border-color .2s,box-shadow .2s,transform .12s}
.row[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.row .tx{flex:1;min-width:0}.row b{display:block;font-weight:600}.row small{color:var(--muted);font-size:12.5px}.row .pr{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ico{width:42px;height:42px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent);flex:none}.ico svg{width:24px;height:24px}
.tog{width:46px;height:28px;border-radius:999px;background:#D6D3CC;position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.row[aria-pressed="true"] .tog{background:var(--accent)}.row[aria-pressed="true"] .tog::after{transform:translateX(18px)}
.list{display:grid;gap:10px}
.sum{background:var(--card);border-radius:18px;border:1.5px solid var(--line);padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.sum div:last-child{border-bottom:0}.sum span{color:var(--muted)}.sum strong{font-weight:600;text-align:right}
.big{margin:14px 0 4px;padding:15px;border-radius:18px;background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:end;gap:10px}
.big small{opacity:.78;font-size:12.5px;display:block}.big div div{font-size:28px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.big .mo{text-align:right;font-size:13px;opacity:.92}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badges span{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--soft)}
form{display:grid;gap:10px;margin-top:14px}label.f{font-size:13px;font-weight:600;display:grid;gap:6px}
form input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none}form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}form input.bad{border-color:#B4432F}
.err{color:#B4432F;font-size:13px;min-height:18px;margin:0}
.done{text-align:center;padding-top:6px}.tick{width:64px;height:64px;border-radius:50%;background:var(--accent);margin:4px auto 12px;display:grid;place-items:center}
.tick svg{width:30px;height:30px}.tick path{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.foot{display:flex;align-items:center;gap:10px;padding-block:10px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)}
.price{flex:1;min-width:0}.price small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}.price b{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.price em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.back{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .12s}.back svg{width:20px;height:20px}
.back:active,.next:active{transform:scale(.96)}
.next{height:54px;padding:0 26px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;flex:none;transition:transform .12s}.next.wide{flex:1}
[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){h1{font-size:27px}.preview{height:45vh;min-height:240px}}
</style>

  intro:()=>`<h1>Design your <b>dream garden</b></h1><p class="lede">Watch a tired garden turn into yours. Pick the patio, lawn, fencing and a centrepiece, then switch to evening and see it lit up. Fixed price, designed and built by us.</p>
    <div class="chips"><span class="chip">Free design visit</span><span class="chip">10-year guarantee</span><span class="chip">Built in 3 to 4 weeks</span></div>`,
  patio:()=>`<h2>Choose your <b>patio</b></h2><p class="lede">Laid on a proper sub-base, pointed and sealed.</p><div class="grid g2">${PATIOS.map(o=>`<button class="opt" data-k="patio" data-v="${o.id}" ${pr(S.patio===o.id)}><span class="img" style="background-image:url(${SW[o.id]})"></span><b>${o.name}</b><span class="pp">${gbp(o.p)}</span></button>`).join('')}</div>`,
  lawn:()=>`<h2>The <b>lawn</b></h2><p class="lede">Levelled, edged in steel, with planted borders either side.</p><div class="list">${LAWNS.map(o=>`<button class="row" data-k="lawn" data-v="${o.id}" ${pr(S.lawn===o.id)}><span class="ico" style="background-image:url(${SW[o.id]});background-size:cover"></span><span class="tx"><b>${o.name}</b><small>${o.sub}</small></span><span class="pr">${gbp(o.p)}</span></button>`).join('')}</div>`,
  fence:()=>`<h2>Pick your <b>fencing</b></h2><p class="lede">Around all three sides, 1.8m high.</p><div class="grid g2">${FENCES.map(o=>`<button class="opt" data-k="fence" data-v="${o.id}" ${pr(S.fence===o.id)}><span class="img" style="background-image:url(${SW[o.id]})"></span><b>${o.name}</b><span class="pp">${gbp(o.p)}</span></button>`).join('')}</div>`,
  feature:()=>`<h2>Choose a <b>centrepiece</b></h2><p class="lede">The bit at the end of the garden everyone ends up at.</p><div class="list">${FEATURES.map(o=>`<button class="row" data-k="feature" data-v="${o.id}" ${pr(S.feature===o.id)}><span class="ico">${fIco[o.id]}</span><span class="tx"><b>${o.name}</b><small>${o.sub}</small></span><span class="pr">${gbp(o.p)}</span></button>`).join('')}</div>`,
  extras:()=>`<h2>Finishing <b>touches</b></h2><p class="lede">Tap to add or remove. Try evening mode with the lights on.</p><div class="list">${EXTRAS.map(o=>`<button class="row" data-x="${o.id}" ${pr(ex(o.id))}><span class="tx"><b>${o.name}</b><small>${o.sub}</small></span><span class="pr">+${gbp(o.p)}</span><span class="tog"></span></button>`).join('')}</div>`,
  quote:()=>{const e=[...S.extras].map(id=>find(EXTRAS,id).name).join(', ')||'None',t=total();
    return `<h2>Your <b>new garden</b></h2><div class="sum"><div><span>Design and groundworks</span><strong>Included</strong></div><div><span>Patio</span><strong>${find(PATIOS,S.patio).name}</strong></div>
      <div><span>Lawn</span><strong>${find(LAWNS,S.lawn).name}</strong></div><div><span>Fencing</span><strong>${find(FENCES,S.fence).name}</strong></div><div><span>Centrepiece</span><strong>${find(FEATURES,S.feature).name}</strong></div><div><span>Extras</span><strong>${e}</strong></div></div>
    <div class="big"><div><small>Fixed price, designed and built</small><div>${gbp(t)}</div></div><div class="mo">or ${gbp(monthly(t))} a month<br><small>over 60 months</small></div></div>
    <div class="badges"><span>Skips and waste included</span><span>Planting plan included</span><span>No mess left behind</span></div>
    <form novalidate><label class="f" for="f-name">Your name<input id="f-name" autocomplete="name" placeholder="Sarah Mitchell"></label><label class="f" for="f-phone">Mobile number<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07700 900123"></label>
      <label class="f" for="f-pc">Postcode<input id="f-pc" autocomplete="postal-code" placeholder="HA6 2AB" style="text-transform:uppercase"></label><p class="err" id="err"></p></form>`},
  done:()=>`<div class="done"><div class="tick"><svg viewBox="0 0 30 30"><path d="M7 15.5l5.5 5.5L23.5 9"/></svg></div><h2>Lovely ${sentName}, <b>your design's saved</b></h2>
    <p class="lede" style="margin-inline:auto">A garden designer would now text you to book a free visit, with your 3D design and fixed price attached.</p><p class="note">This is a demo, so nothing has been sent.</p></div>`};
function render(){const name=STEPS[step],p=$('panel');p.innerHTML=screens[name]();p.classList.remove('enter-f','enter-b');void p.offsetWidth;p.classList.add(dir>0?'enter-f':'enter-b');p.scrollTop=0;
  [...$('segs').children].forEach((el,i)=>el.classList.toggle('on',i<Math.min(step,6)));$('stepno').textContent=step===0?'Takes 60 seconds':name==='done'?'Saved':`Step ${step} of 6`;
  $('back').hidden=step===0||name==='done';$('pricebox').hidden=step===0;const nx=$('next');nx.textContent=step===0?'Design my garden':name==='quote'?'Book a free design visit':name==='done'?'Design another':'Next';nx.classList.toggle('wide',step===0||name==='quote'||name==='done');
  if(FX.before&&name!=='intro')setBefore(false);flyTo(stepCam[name])}
function go(d){dir=d;step=Math.max(0,Math.min(STEPS.length-1,step+d));render()}
function goTo(n){const i=STEPS.indexOf(n);if(i<0||i===step)return;dir=i>step?1:-1;step=i;render()}
let tt;function toast(h,ms=1600){const t=$('toast');t.innerHTML=h;t.classList.remove('off');clearTimeout(tt);if(ms)tt=setTimeout(()=>t.classList.add('off'),ms)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function setBefore(v){FX.before=v;const b=$('fxBefore');b.setAttribute('aria-pressed',v);b.querySelector('span').textContent=v?'See after':'See before';const bd=$('badge');bd.textContent=v?'Before':'After';bd.classList.toggle('after',!v)}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-x]');if(!b)return;buzz();
  if(b.dataset.k){const k=b.dataset.k;S[k]=b.dataset.v;b.parentElement.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));if(k==='feature'){roofLvl=0;FX.roof=false;setRoofBtn()}}
  else{const id=b.dataset.x;const on=!ex(id);on?S.extras.add(id):S.extras.delete(id);b.setAttribute('aria-pressed',on);if((id==='festoon'||id==='lights')&&on&&!FX.mood)toast('Try evening mode to see them glow')}
  buildNew()});
$('back').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>{const name=STEPS[step];if(name==='done'){dir=-1;step=1;render();return}
  if(name==='quote'){const n=$('f-name'),ph=$('f-phone'),pc=$('f-pc');[n,ph,pc].forEach(i=>i.classList.remove('bad'));let msg='';
    if(!/^\+?[\d\s]{10,14}$/.test(ph.value.trim())){ph.classList.add('bad');msg='Add a UK mobile number so we can text you.'}
    if(pc.value.trim().length<5){pc.classList.add('bad');msg=msg||'Add your postcode so we know you are in our area.'}
    if(n.value.trim().length<2){n.classList.add('bad');msg='Add your name so we know who to ask for.'}$('err').textContent=msg;if(msg)return;sentName=n.value.trim().split(' ')[0]}go(1)});
document.addEventListener('submit',e=>e.preventDefault());
$('fxBefore').addEventListener('click',()=>{buzz();setBefore(!FX.before);if(!tween&&STEPS[step]!=='intro')flyTo('wide')});
$('fxMood').addEventListener('click',e=>{buzz();FX.mood=!FX.mood;e.currentTarget.setAttribute('aria-pressed',FX.mood);e.currentTarget.querySelector('span').textContent=FX.mood?'Daytime':'Evening'});
function setRoofBtn(){const b=$('fxRoof');b.setAttribute('aria-pressed',FX.roof);b.querySelector('span').textContent=FX.roof?'Close roof':'Open roof'}
$('fxRoof').addEventListener('click',()=>{buzz();FX.roof=!FX.roof;setRoofBtn();flyTo('feature')});
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};if(!touched){touched=true;$('toast').classList.add('off')}tween=null});
canvas.addEventListener('pointerup',e=>{if(!down||!camera)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dtm=performance.now()-down.t;down=null;if(moved>8||dtm>400||STEPS[step]==='done'||FX.before)return;
  const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects(newG.children,true);
  for(const h of hits){let o=h.object;while(o&&!o.userData.step)o=o.parent;if(o&&o.userData.step&&LABEL[o.userData.step]){buzz();toast('Editing: '+LABEL[o.userData.step],1300);goTo(o.userData.step);break}}});

/* ================= START ================= */
if(scene){buildBase();buildOld();buildNew();resize();flyTo('wide',true);render();
  trans=0;setBefore(true);applyTransition();FX.before=true;
  requestAnimationFrame(loop);
  setTimeout(()=>{$('loading').classList.add('off')},350);
  setTimeout(()=>{setBefore(false);toast('Here\'s the after. Drag to look around',2600)},1900)}
else render();
</script>
</body>
</html>
