<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Fernhurst Garden Room Designer</title>
<meta name="theme-color" content="#F2F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--paper:#F2F1EC;--card:#fff;--ink:#15181A;--muted:#696C6A;--line:#E1DED7;--accent:#2E4434;--soft:#E8ECE5;
  --f:'Inter Tight',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);overflow:hidden;font-size:15px;padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;max-width:560px;margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:12px 9px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand svg{width:24px;height:24px}.brand span{font-weight:300;color:var(--muted)}
.stepno{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:10px}
.segs i{height:3px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.segs i.on::after{transform:scaleX(1)}
.preview{position:relative;height:50vh;min-height:280px;border-radius:24px;overflow:hidden;background:#CFDDE6 center/cover no-repeat;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -24px rgba(20,30,24,.6);touch-action:none}
#c{display:block;width:100%;height:100%}
.ov-top{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:8px;pointer-events:none}
.spec{font-size:12px;font-weight:600;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.toast{position:absolute;left:50%;top:50px;transform:translateX(-50%);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:999px;white-space:nowrap;background:rgba(21,24,26,.84);color:#fff;pointer-events:none;transition:opacity .45s,transform .45s;display:flex;gap:7px;align-items:center}
.toast.off{opacity:0;transform:translate(-50%,-6px)}.toast svg{width:15px;height:15px}
.fx{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:7px}
.fxb{height:42px;padding:0 13px 0 11px;border-radius:999px;border:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);transition:background .3s,color .3s,transform .12s;white-space:nowrap}
.fxb:active{transform:scale(.95)}.fxb svg{width:17px;height:17px;flex:none}
.fxb[aria-pressed="true"]{background:var(--ink);color:#fff}
.fxb.go{background:var(--accent);color:#fff;margin-left:auto}
.photo{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 12px;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
.photo label{font-size:12px;font-weight:600;color:var(--muted);flex:none}
.photo input[type=range]{flex:1;accent-color:var(--accent);height:28px;min-width:0}
.photo button{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:600;flex:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#CFDDE6;transition:opacity .7s;font-weight:500;color:var(--muted);font-size:13px}
.loading.off{opacity:0;pointer-events:none}
.loading span::before{content:"";display:block;width:26px;height:26px;margin:0 auto 10px;border-radius:50%;border:3px solid #b9c7cf;border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:16px 18px;margin-inline:-4px;padding-inline:4px}
.enter-f{animation:inF .4s cubic-bezier(.2,.8,.2,1)}.enter-b{animation:inB .4s cubic-bezier(.2,.8,.2,1)}
@keyframes inF{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
h1{font-size:32px;line-height:1.04;letter-spacing:-.045em;font-weight:300;margin:2px 0 10px;text-wrap:balance}h1 b,h2 b{font-weight:700}
h2{font-size:22px;letter-spacing:-.035em;font-weight:300;margin:0 0 4px}
.lede{color:var(--muted);line-height:1.5;margin:0 0 14px;max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--accent)}
.sub{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.opt{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,box-shadow .2s,transform .12s}
.opt:active,.row:active{transform:scale(.97)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.opt b{font-size:15px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.opt small{font-size:12.5px;color:var(--muted);line-height:1.35}
.opt .pp{font-size:12px;color:var(--muted);font-weight:500}
.opt.sw{padding:6px 6px 10px;text-align:center;align-items:stretch}.opt.sw b{font-size:13px}
.img{height:64px;border-radius:12px;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.size{font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}.size span{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:3px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:15px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;min-height:50px;font-weight:600;font-size:14px;transition:background .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 8px -3px rgba(0,0,0,.25)}
.seg small{font-weight:400;font-size:11px;color:var(--muted)}.seg i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--accent)}.ico svg{width:24px;height:24px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;min-height:64px;width:100%;text-align:left;transition:border-color .2s,box-shadow .2s,transform .12s}
.row[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.row .tx{flex:1;min-width:0}.row b{display:block;font-weight:600}.row small{color:var(--muted);font-size:12.5px}
.row .pr{font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tog{width:46px;height:28px;border-radius:999px;background:#D6D3CC;position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.row[aria-pressed="true"] .tog{background:var(--accent)}.row[aria-pressed="true"] .tog::after{transform:translateX(18px)}
.list{display:grid;gap:10px}
.sum{background:var(--card);border-radius:18px;border:1.5px solid var(--line);padding:4px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.sum div:last-child{border-bottom:0}
.sum span{color:var(--muted)}.sum strong{font-weight:600;text-align:right}
.big{margin:14px 0 4px;padding:15px;border-radius:18px;background:var(--accent);color:#fff;display:flex;justify-content:space-between;align-items:end;gap:10px}
.big small{opacity:.78;font-size:12.5px;display:block}.big div div{font-size:28px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big .mo{text-align:right;font-size:13px;opacity:.92}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badges span{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--soft)}
form{display:grid;gap:10px;margin-top:14px}label.f{font-size:13px;font-weight:600;display:grid;gap:6px}
form input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px;outline:none}
form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}form input.bad{border-color:#B4432F}
.err{color:#B4432F;font-size:13px;min-height:18px;margin:0}
.done{text-align:center;padding-top:6px}.tick{width:64px;height:64px;border-radius:50%;background:var(--accent);margin:4px auto 12px;display:grid;place-items:center}
.tick svg{width:30px;height:30px}.tick path{stroke:#fff;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.foot{display:flex;align-items:center;gap:10px;padding-block:10px max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--paper)}
.price{flex:1;min-width:0}.price small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.price b{font-size:19px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.price em{font-style:normal;font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.back{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .12s}
.back:active,.next:active{transform:scale(.96)}.back svg{width:20px;height:20px}
.next{height:54px;padding:0 26px;border:0;border-radius:999px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;flex:none;transition:transform .12s}
.next.wide{flex:1}
[hidden]{display:none!important}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:700px){h1{font-size:27px}.preview{height:45vh;min-height:240px}}
</style>
</head>

  <header>

      <div class="stepno" id="stepno"></div>

  <div class="preview" id="preview">
    <canvas id="c"></canvas>
    <div class="ov-top"><span class="spec" id="spec"></span></div>
    <div class="toast off" id="toast"></div>
    <div class="fx" id="fx">
      <button class="fxb" id="fxOpen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 20V6l4-2v16M7 4l4 2v14M11 6l4-2v16M15 4l4 2v14"/><path d="M2 20h20"/></svg><span>Open doors</span></button>
      <button class="fxb" id="fxMood" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>Evening</span></button>

    <div class="loading" id="loading"><span>Building your garden room</span></div>
  </div>
  <main class="panel" id="panel"></main>
  <footer class="foot">
    <div class="price" id="pricebox"><small>Fixed price, built and fitted</small><b id="price">£0</b><em id="monthly"></em></div>
    <button class="back" id="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="next" id="next">Next</button>
  </footer>
</div>

      <label class="f" for="f-phone">Mobile number<input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="07700 900123"></label>
      <label class="f" for="f-pc">Postcode<input id="f-pc" autocomplete="postal-code" placeholder="HA6 2AB" style="text-transform:uppercase"></label><p class="err" id="err"></p></form>`},
  done:()=>`<div class="done"><div class="tick"><svg viewBox="0 0 30 30"><path d="M7 15.5l5.5 5.5L23.5 9"/></svg></div><h2>Great choice ${sentName}, <b>it's saved</b></h2>
    <p class="lede" style="margin-inline:auto">A designer would now text you to book a free site visit, with your 3D design and fixed price attached.</p><p class="note">This is a demo, so nothing has been sent.</p></div>`};
function render(){const name=STEPS[step],p=$('panel');p.innerHTML=screens[name]();p.classList.remove('enter-f','enter-b');void p.offsetWidth;p.classList.add(dir>0?'enter-f':'enter-b');p.scrollTop=0;
  [...$('segs').children].forEach((el,i)=>el.classList.toggle('on',i<Math.min(step,6)));
  $('stepno').textContent=step===0?'Takes 60 seconds':name==='done'?'Saved':`Step ${step} of 6`;$('back').hidden=step===0||name==='done';$('pricebox').hidden=step===0;
  const nx=$('next');nx.textContent=step===0?'Design my room':name==='quote'?'Book a free site visit':name==='done'?'Design another':'Next';nx.classList.toggle('wide',step===0||name==='quote'||name==='done');
  if(name==='use'&&!FX.open)setOpenFx(true);
  flyTo(stepCam[name])}
function go(d){dir=d;step=Math.max(0,Math.min(STEPS.length-1,step+d));render()}
function goTo(n){const i=STEPS.indexOf(n);if(i<0||i===step)return;dir=i>step?1:-1;step=i;render()}
let tt;function toast(h,ms=1600){const t=$('toast');t.innerHTML=h;t.classList.remove('off');clearTimeout(tt);if(ms)tt=setTimeout(()=>t.classList.add('off'),ms)}
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function setOpenFx(v){FX.open=v;const b=$('fxOpen');b.setAttribute('aria-pressed',v);b.querySelector('span').textContent=v?'Close doors':'Open doors'}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-k],[data-x]');if(!b)return;buzz();let rb=false;
  if(b.dataset.k){const k=b.dataset.k;S[k]=b.dataset.v;b.parentElement.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(['size','glaze','use'].includes(k))rb=true;if(k==='size')setTimeout(()=>flyTo('size'),30);if(k==='glaze'){openLvl=0;setOpenFx(false);setTimeout(()=>{setOpenFx(true)},700)}}
  else{const id=b.dataset.x;const on=!ex(id);on?S.extras.add(id):S.extras.delete(id);b.setAttribute('aria-pressed',on);rb=true;if(id==='leds'&&on&&!FX.mood)toast('Try evening mode to see them glow')}
  if(rb)buildRoom();finishes()});
$('back').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>{const name=STEPS[step];if(name==='done'){dir=-1;step=1;render();return}
  if(name==='quote'){const n=$('f-name'),ph=$('f-phone'),pc=$('f-pc');[n,ph,pc].forEach(i=>i.classList.remove('bad'));let msg='';
    if(!/^\+?[\d\s]{10,14}$/.test(ph.value.trim())){ph.classList.add('bad');msg='Add a UK mobile number so we can text you.'}
    if(pc.value.trim().length<5){pc.classList.add('bad');msg=msg||'Add your postcode so we know you are in our area.'}
    if(n.value.trim().length<2){n.classList.add('bad');msg='Add your name so we know who to ask for.'}
    $('err').textContent=msg;if(msg)return;sentName=n.value.trim().split(' ')[0]}go(1)});
document.addEventListener('submit',e=>e.preventDefault());
$('fxOpen').addEventListener('click',()=>{buzz();setOpenFx(!FX.open);if(FX.open&&!['use','glaze'].includes(STEPS[step]))flyTo('open')});
$('fxMood').addEventListener('click',e=>{buzz();FX.mood=!FX.mood;e.currentTarget.setAttribute('aria-pressed',FX.mood);e.currentTarget.querySelector('span').textContent=FX.mood?'Daytime':'Evening'});

/* ---- photo mode ---- */
let pScale=1,pOff=new THREE.Vector2();
$('fxPhoto').addEventListener('click',()=>{buzz();$('pFile').click()});
$('pFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;enterPhoto(URL.createObjectURL(f));e.target.value=''});
function enterPhoto(url){FX.photo=true;preview.style.backgroundImage=`url(${url})`;scene.background=null;scene.fog.near=999;scene.fog.far=1000;garden.visible=false;controls.enabled=false;tween=null;
  const c=cams().photo;camera.position.set(...c.p);controls.target.set(...c.t);camera.lookAt(...c.t);pScale=1;pOff.set(0,0);applyPhoto();$('pScale').value=100;$('fx').hidden=true;$('photoBar').hidden=false;
  toast('Drag the room into place, then use Size',3000);dirty=10}
function exitPhoto(){FX.photo=false;preview.style.backgroundImage='';scene.background=BG_DAY.clone().lerp(BG_EVE,moodLvl);scene.fog.near=16;scene.fog.far=34;garden.visible=true;controls.enabled=true;
  room.scale.setScalar(1);room.position.set(0,0,-.4);$('fx').hidden=false;$('photoBar').hidden=true;flyTo(stepCam[STEPS[step]]);dirty=30}
function applyPhoto(){room.scale.setScalar(pScale);room.position.set(pOff.x,pOff.y,-.4);dirty=4}
$('pScale').addEventListener('input',e=>{pScale=e.target.value/100;applyPhoto()});$('pDone').addEventListener('click',()=>{buzz();exitPhoto()});

/* ---- pointer ---- */
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now(),ox:pOff.x,oy:pOff.y};if(!touched){touched=true;$('toast').classList.add('off')}tween=null;if(FX.photo)canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!FX.photo||!down)return;const h=canvas.clientHeight,vis=2*Math.tan(camera.fov*PI/360)*camera.position.distanceTo(controls.target),k=vis/h;pOff.set(down.ox+(e.clientX-down.x)*k,down.oy-(e.clientY-down.y)*k);applyPhoto()});
canvas.addEventListener('pointerup',e=>{if(!down||!camera)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y),dtm=performance.now()-down.t;down=null;
  if(FX.photo||moved>8||dtm>400||STEPS[step]==='done')return;const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);const hits=ray.intersectObjects(room.children,true);
  for(const h of hits){let o=h.object;while(o&&!o.userData.step)o=o.parent;if(o&&o.userData.step&&LABEL[o.userData.step]){buzz();toast('Editing: '+LABEL[o.userData.step],1300);goTo(o.userData.step);break}}});

/* ================= START ================= */
buildGarden();finishes();M.alu.color.copy(target.alu);buildRoom();resize();flyTo('wide',true);render();requestAnimationFrame(loop);
setTimeout(()=>{$('loading').classList.add('off');toast('<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-2a1.5 1.5 0 0 1 3 0V12M14 10.5a1.5 1.5 0 0 1 3 0V12M17 11.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2a6 6 0 0 1-5-2.7L4.5 15a1.6 1.6 0 0 1 2.6-1.8L8 14.5"/></svg>Drag to look around, tap the room to edit',3200)},350);
</script>
</body>
</html>
