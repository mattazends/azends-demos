<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Novus Maintenance · Azends Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0D10;--panel:#131418;--panel2:#18191E;--line:#24262C;--line2:#2E3038;
  --tx:#ECEDF0;--tx2:#A3A7B3;--tx3:#6B7080;--blue:#2F7BFF;--blue2:#5B97FF;--purple:#A879FF;--green:#34D399;--amber:#FBBF24;--red:#F87171;--yellow:#FFE600;
  --r:12px;--ease:cubic-bezier(.2,.7,.1,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Geist,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
.mono{font-family:"Geist Mono",ui-monospace,monospace}
svg{display:block}

/* ---------- top bar ---------- */
.top{height:52px;display:flex;align-items:center;gap:14px;padding:0 12px 0 14px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.02em;white-space:nowrap}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--yellow);box-shadow:0 0 10px 2px rgba(255,230,0,.55);display:inline-block;margin-left:1px;transform:translateY(3px)}
.brand small{font-weight:400;color:var(--tx3);font-size:12px;margin-left:4px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--tx2);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.crumb b{color:var(--tx);font-weight:500}
.proj-dot{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,#1F5EFF,#0A0F1C);display:flex;align-items:center;justify-content:center}
.modes{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;margin:0 auto}
.modes button{padding:6px 13px;border-radius:7px;color:var(--tx2);font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.modes button:hover{color:var(--tx)}
.modes button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
.modes svg{width:14px;height:14px;opacity:.8}
.top-r{display:flex;align-items:center;gap:8px}
.bp{display:flex;gap:2px;padding:3px;border-radius:9px;border:1px solid var(--line)}
.bp button{width:30px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.bp button.on{background:var(--panel2);color:var(--tx)}
.bp svg{width:15px;height:15px}
.slop-chip{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:rgba(52,211,153,.1);color:var(--green);font-weight:500;font-size:12px;white-space:nowrap;border:1px solid rgba(52,211,153,.25)}
.slop-chip.bad{background:rgba(248,113,113,.1);color:var(--red);border-color:rgba(248,113,113,.3)}
.slop-chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.avs{display:flex}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:2px solid var(--panel);margin-left:-6px}
.btn{height:32px;padding:0 13px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:all .2s}
.btn-ghost{background:var(--panel2);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:#3A3D47}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue2)}

/* ---------- layout ---------- */
.app{height:calc(100% - 52px);display:grid;grid-template-columns:264px 1fr 312px}
.app.full{grid-template-columns:1fr}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side.r{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
.tabs button{padding:8px 10px 10px;color:var(--tx3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--tx);border-color:var(--tx)}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:10px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#2A2C33;border-radius:8px}
.grp{font-size:11px;color:var(--tx3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;padding:12px 8px 6px;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;color:var(--tx2);cursor:pointer;position:relative;user-select:none}
.row:hover{background:var(--panel2);color:var(--tx)}
.row.on{background:rgba(47,123,255,.14);color:#fff}
.row svg{width:14px;height:14px;flex:none;opacity:.75}
.row .sub{margin-left:auto;font-size:11px;color:var(--tx3)}
.row.ind{padding-left:28px}
.badge{font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;background:rgba(168,121,255,.14);color:var(--purple);margin-left:auto}
.badge.g{background:rgba(52,211,153,.12);color:var(--green)}
.badge.b{background:rgba(47,123,255,.15);color:var(--blue2)}
.layer .grip{opacity:0;color:var(--tx3);margin-left:auto;cursor:grab}
.layer:hover .grip{opacity:1}
.layer.drag-over-top{box-shadow:inset 0 2px 0 var(--blue)}
.layer.drag-over-bot{box-shadow:inset 0 -2px 0 var(--blue)}
.layer .mv{display:none;gap:2px;margin-left:auto}
.layer .mv button{width:22px;height:22px;border-radius:5px;background:var(--panel2);color:var(--tx2)}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px}
.ins-i{border:1px solid var(--line);border-radius:10px;padding:8px;cursor:grab;background:var(--panel2);transition:border-color .2s,transform .2s}
.ins-i:hover{border-color:var(--blue);transform:translateY(-1px)}
.ins-i .th{height:54px;border-radius:6px;background:#F5F7FA;margin-bottom:7px;position:relative;overflow:hidden}
.ins-i span{font-size:12px;color:var(--tx2)}
.th i{position:absolute;display:block;border-radius:2px}

/* ---------- canvas ---------- */
.canvas{position:relative;overflow:auto;background-color:#0F1013;background-image:radial-gradient(#23252B 1px,transparent 1px);background-size:18px 18px;min-height:0}
.board-wrap{padding:48px 40px 140px;display:flex;flex-direction:column;align-items:center}
.board-label{align-self:stretch;display:flex;justify-content:space-between;color:var(--tx3);font-size:12px;margin-bottom:10px}
.board-label b{color:var(--tx2);font-weight:500}
.board-hold{position:relative}
.board{transform-origin:0 0;background:#fff;box-shadow:0 30px 80px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);container-type:inline-size;position:absolute;left:0;top:0}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;z-index:5}
.zoom button{padding:5px 9px;border-radius:7px;color:var(--tx2);font-size:12px}
.zoom button.on{background:var(--panel2);color:var(--tx)}
.drop-line{position:absolute;left:0;right:0;height:calc(4px*var(--inv));background:var(--blue);z-index:50;pointer-events:none;display:none;box-shadow:0 0 0 calc(2px*var(--inv)) rgba(47,123,255,.25)}
.drop-line:before{content:attr(data-l);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--blue);color:#fff;font:500 calc(12px*var(--inv)) Geist;padding:calc(4px*var(--inv)) calc(10px*var(--inv));border-radius:calc(6px*var(--inv));white-space:nowrap}
.blk{position:relative}
.blk:hover{outline:calc(1.5px*var(--inv)) dashed rgba(47,123,255,.7);outline-offset:calc(-1.5px*var(--inv));z-index:3}
.blk.sel{outline:calc(2.5px*var(--inv)) solid var(--blue);outline-offset:calc(-2.5px*var(--inv));z-index:4}
.blk-tag{position:absolute;left:0;top:0;z-index:20;transform:translateY(-100%);background:var(--blue);color:#fff;font:500 calc(11.5px*var(--inv)) Geist;padding:calc(4px*var(--inv)) calc(9px*var(--inv));border-radius:calc(5px*var(--inv)) calc(5px*var(--inv)) 0 0;display:none;align-items:center;gap:calc(6px*var(--inv));cursor:grab;white-space:nowrap}
.blk-tag em{font-style:normal;opacity:.7}
.blk:first-child .blk-tag{transform:none;border-radius:0 0 calc(5px*var(--inv)) 0}
.blk.sel .blk-tag,.blk:hover .blk-tag{display:flex}
.bound{box-shadow:0 calc(2px*var(--inv)) 0 0 var(--purple);background:rgba(168,121,255,.08);border-radius:2px}
.flash{animation:flash 1.2s var(--ease)}
@keyframes flash{0%{background:rgba(47,123,255,.25)}100%{background:transparent}}

/* ---------- inspector ---------- */
.insp-h{padding:14px 14px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.insp-h .ic{width:30px;height:30px;border-radius:8px;background:rgba(47,123,255,.14);color:var(--blue2);display:flex;align-items:center;justify-content:center}
.insp-h .ic svg{width:16px;height:16px}
.insp-h b{font-weight:500;font-size:14px;display:block}
.insp-h small{color:var(--tx3);font-size:11.5px}
.field{margin-bottom:14px}
.field label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-bottom:6px;font-weight:500}
.field input,.field textarea,.field select{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;transition:border-color .2s;resize:vertical;line-height:1.45}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.cnt{font-variant-numeric:tabular-nums}.cnt.ok{color:var(--green)}.cnt.warn{color:var(--amber)}
.seg{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:3px}
.seg button{flex:1;padding:6px 0;border-radius:6px;color:var(--tx2);font-size:12px}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
input[type=range]{width:100%;accent-color:var(--blue)}
.fw{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-bottom:14px;background:linear-gradient(180deg,rgba(168,121,255,.07),transparent)}
.fw-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fw-top .who{width:26px;height:26px;border-radius:50%;background:#262033;color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex:none}
.fw-top b{font-weight:500;font-size:13px;display:block}
.fw-top small{color:var(--tx3);font-size:11px}
.fw p{color:var(--tx2);font-size:12px;line-height:1.5}
.tpl{font-family:"Geist Mono",monospace;font-size:11.5px;line-height:1.7;color:var(--tx2);background:var(--bg);border:1px dashed var(--line2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.slot{background:rgba(168,121,255,.16);color:#CDB4FF;border-radius:4px;padding:1px 5px}
.slot.n{background:rgba(47,123,255,.18);color:#AFCBFF}
.chk{border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.chk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:500}
.chk-l{display:grid;gap:6px}
.chk-l div{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--tx2);line-height:1.4}
.chk-l .d{width:14px;height:14px;border-radius:50%;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700}
.d.ok{background:rgba(52,211,153,.18);color:var(--green)}
.d.no{background:rgba(248,113,113,.18);color:var(--red)}
.bind{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:8px;font-size:12px}
.bind .mono{color:var(--purple);margin-left:auto;font-size:11px}
.serp{background:#fff;border-radius:10px;padding:14px;color:#202124;font-family:Arial,sans-serif}
.serp .u{font-size:12px;color:#4d5156;display:flex;align-items:center;gap:8px}
.serp .u i{width:22px;height:22px;border-radius:50%;background:#0A0F1C;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px}
.serp .t{color:#1a0dab;font-size:17px;margin:6px 0 3px;line-height:1.3}
.serp .d{font-size:13px;color:#4d5156;line-height:1.5}
.empty{padding:22px 16px;color:var(--tx3);font-size:12.5px;line-height:1.6}

/* ---------- data views ---------- */
.view{display:none;height:100%;min-height:0}
.view.on{display:grid}
.dv{grid-template-columns:240px 1fr;height:100%}
.dv-main{overflow:auto;padding:26px 30px 120px;min-width:0}
.dv-main h1{font-size:24px;font-weight:500;letter-spacing:-.03em}
.dv-main .lead{color:var(--tx2);margin-top:6px;font-size:13.5px;max-width:720px;line-height:1.55}
.banner{display:flex;align-items:center;gap:14px;margin:18px 0 20px;padding:14px 16px;border-radius:12px;background:linear-gradient(90deg,rgba(168,121,255,.12),rgba(47,123,255,.08));border:1px solid rgba(168,121,255,.25)}
.banner b{font-weight:500}
.banner .big{font-size:26px;font-weight:600;letter-spacing:-.03em;color:#fff}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;font-weight:500;color:var(--tx3);padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);white-space:nowrap;font-size:11.5px}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .15s}
.tbl tbody tr:hover td{background:rgba(255,255,255,.02)}
.tbl tbody tr.on td{background:rgba(47,123,255,.08)}
.tbl td b{color:var(--tx);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(52,211,153,.12);color:var(--green);white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
.pill.p{background:rgba(168,121,255,.14);color:var(--purple)}
.pill.b{background:rgba(47,123,255,.14);color:var(--blue2)}
.pill.y{background:rgba(251,191,36,.12);color:var(--amber)}
.drawer{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:0 0 60px;min-width:0}
.dv3{grid-template-columns:240px 1fr 340px}

/* copy lab */
.fw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;margin-top:22px}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .who{width:34px;height:34px;border-radius:50%;background:#221C30;color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.card-h b{font-weight:500;font-size:14px;display:block}
.card-h small{color:var(--tx3);font-size:11.5px}
.card p.why{color:var(--tx2);font-size:12.5px;line-height:1.55}
.card .out{font-size:15px;line-height:1.45;color:#fff;letter-spacing:-.01em;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line2)}
.card .out .sw{background:rgba(47,123,255,.18);color:#BFD5FF;border-radius:4px;padding:0 4px}
.card .used{display:flex;flex-wrap:wrap;gap:6px}
.card .used span{font-size:11px;color:var(--tx3);border:1px solid var(--line2);border-radius:999px;padding:3px 8px}
.flip{align-self:flex-start;font-size:11.5px;color:var(--blue2);font-weight:500}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:14px}
.rule{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.rule b{font-weight:500;display:block;margin-bottom:2px}
.rule small{color:var(--tx3);font-size:11.5px;line-height:1.45}
.voc{display:grid;gap:8px;margin-top:14px}
.voc div{display:grid;grid-template-columns:1fr 24px 1fr;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.voc q{color:var(--tx2);font-style:italic}
.voc span{color:#fff}
.h2{font-size:17px;font-weight:500;margin-top:34px;letter-spacing:-.02em}
.h2 small{color:var(--tx3);font-weight:400;font-size:12.5px;margin-left:8px}
.try{display:flex;gap:8px;margin-top:14px}
.try textarea{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:64px;outline:none}
.try-out{margin-top:10px}

/* leads */
.flow{display:flex;align-items:stretch;gap:0;margin:20px 0 26px;flex-wrap:wrap}
.node{flex:1;min-width:150px;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--panel)}
.node small{color:var(--tx3);font-size:11px}
.node b{display:block;font-weight:500;margin-top:3px}
.arrow{width:34px;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.note{font-size:11.5px;color:var(--tx3);margin-top:10px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:#fff;color:#0A0F1C;padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:0 20px 50px -10px rgba(0,0,0,.5);transition:all .35s var(--ease);z-index:100;display:flex;gap:8px;align-items:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- mini site (inside the artboard) ---------- */
.site{--ink:#0A0F1C;--paper:#F5F7FA;--line:#E2E7EF;--mute:#5E6878;--ice:#1F5EFF;--ice-soft:#EAF0FF;font-family:Geist,sans-serif;color:var(--ink);font-size:17px;line-height:1.5;font-weight:400}
.site b{font-weight:600}
.site .w{max-width:1240px;margin:0 auto;padding:0 64px}
.s-sec{padding:var(--pad,130px) 0;background:var(--sbg,#fff);color:var(--sfg,var(--ink))}
.s-eb{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;color:var(--mute)}
.s-eb:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ice);box-shadow:0 0 0 4px rgba(31,94,255,.15)}
.s-h2{font-size:64px;line-height:1.02;letter-spacing:-.045em;font-weight:300;margin-top:18px;max-width:900px}
.s-lead{font-size:19px;color:var(--mute);max-width:560px;font-weight:300;margin-top:20px}
.s-btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:999px;font-weight:500;font-size:16px}
.s-btn.wh{background:#fff;color:var(--ink)}
.s-btn.g{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3)}
.s-btn.i{background:var(--ice);color:#fff}
.s-btn.k{background:var(--ink);color:#fff}
.dark{--sbg:var(--ink);--sfg:#fff}.dark .s-lead,.dark .s-eb{color:rgba(255,255,255,.62)}
.paper{--sbg:var(--paper)}
/* nav */
.s-nav{position:absolute;left:24px;right:24px;top:20px;z-index:10;display:flex;align-items:center;gap:30px;padding:12px 14px 12px 24px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px)}
.s-nav .lg{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px}
.s-nav .lg small{display:block;font-size:11px;font-weight:400;opacity:.7}
.s-nav nav{display:flex;gap:28px;margin:0 auto;font-size:15px;opacity:.9}
.s-nav .s-btn{height:44px;padding:0 20px;font-size:14px}
.nav-solid .s-nav{position:relative;left:auto;right:auto;top:auto;margin:20px 24px;background:#0A0F1C}
/* hero */
.s-hero{position:relative;min-height:880px;color:#fff;overflow:hidden;background:#0A0F1C}
.s-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,28,.55),rgba(10,15,28,.15) 40%,rgba(10,15,28,.8)),linear-gradient(90deg,rgba(10,15,28,.55),transparent 70%)}
.s-hero .in{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:end;padding:200px 64px 70px;max-width:1360px;margin:0 auto}
.s-chip{display:inline-flex;align-items:center;gap:10px;padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:14px}
.s-chip:before{content:"";width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}
.s-kw{display:block;font-size:15px;font-weight:500;opacity:.8;margin:26px 0 14px}
.s-big{font-size:112px;line-height:.95;letter-spacing:-.055em;font-weight:300}
.s-sub{font-size:20px;max-width:560px;color:rgba(255,255,255,.86);font-weight:300;margin-top:26px}
.s-ctas{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.s-card{background:rgba(255,255,255,.94);color:var(--ink);border-radius:30px;padding:30px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.s-card h4{font-size:24px;font-weight:400;letter-spacing:-.03em}
.s-card p{font-size:14px;color:var(--mute);margin-top:4px}
.s-opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.s-opts span{padding:9px 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;background:#fff}
.s-opts span.on{border-color:var(--ice);background:var(--ice-soft);color:var(--ice)}
.s-card .s-btn{width:100%;justify-content:center;margin-top:20px}
.s-trust{position:relative;z-index:2;display:flex;gap:34px;padding:22px 64px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:rgba(255,255,255,.8);max-width:1360px;margin:0 auto}
.s-trust span:before{content:"✓";margin-right:8px;color:#8FB0FF}
/* logos */
.s-logos{padding:34px 0;text-align:center;border-bottom:1px solid var(--line);background:#fff}
.s-logos p{font-size:13px;color:var(--mute)}
.s-logos .r{display:flex;justify-content:center;align-items:center;gap:60px;margin-top:18px;font-size:22px;font-weight:600;color:#9AA1AE;letter-spacing:-.02em}
/* statement */
.s-stmt{font-size:56px;line-height:1.08;letter-spacing:-.045em;font-weight:300;max-width:1080px}
/* phases */
.s-phases{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);margin-top:56px}
.s-phases div{padding:30px 34px 0;border-left:1px solid var(--line)}
.s-phases div:first-child{border-left:0;padding-left:0}
.s-phases .k{font-size:84px;font-weight:200;letter-spacing:-.06em;line-height:1;color:var(--ice)}
.s-phases h5{font-size:23px;font-weight:500;margin-top:20px;letter-spacing:-.02em}
.s-phases p{color:var(--mute);margin-top:8px;font-size:16px;font-weight:300}
/* clock */
.s-clock{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.s-cc{background:#fff;border-radius:30px;padding:30px;box-shadow:0 30px 70px -30px rgba(10,15,28,.3)}
.s-cc .t{font-size:64px;font-weight:600;letter-spacing:-.04em;margin:8px 0 14px}
.s-cc .t small{font-weight:300;font-size:40px}
.s-cc .bar{height:6px;border-radius:9px;background:linear-gradient(90deg,var(--ice),#CFDDFF);position:relative}
.s-cc .bar:after{content:"";position:absolute;left:55%;top:50%;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.s-cc .out{margin-top:26px;background:var(--ink);color:#fff;border-radius:18px;padding:20px 22px;display:flex;justify-content:space-between;align-items:flex-end}
.s-cc .out small{display:block;font-size:13px;opacity:.6}
.s-cc .out b{font-size:28px}
.s-facts{display:flex;gap:40px;margin-top:34px}
.s-facts div{border-left:1px solid var(--line);padding-left:16px}
.s-facts b{font-size:40px;letter-spacing:-.04em;display:block}
.s-facts span{font-size:14px;color:var(--mute)}
/* services */
.s-svc{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:56px;align-items:start}
.s-svc ol{list-style:none;border-top:1px solid var(--line)}
.s-svc li{display:flex;gap:22px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line);font-size:30px;font-weight:300;letter-spacing:-.03em;color:#9AA1AE}
.s-svc li:first-child{color:var(--ink)}
.s-svc li small{font-size:13px;color:var(--mute);font-weight:400}
.s-svc .img{border-radius:30px;overflow:hidden;aspect-ratio:4/4.3;position:relative}
.s-svc .img img{width:100%;height:100%;object-fit:cover}
.s-svc .img span{position:absolute;left:20px;bottom:20px;right:20px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;border-radius:16px;padding:14px 18px;font-size:18px;border:1px solid rgba(255,255,255,.3)}
/* timeline */
.s-tl{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;margin-top:56px}
.s-tl div{border-top:1px solid rgba(255,255,255,.18);padding-top:24px}
.s-tl .n{font-size:56px;font-weight:200;color:#8FB0FF;letter-spacing:-.05em;line-height:1}
.s-tl small{display:block;margin-top:20px;font-size:13px;color:rgba(255,255,255,.55)}
.s-tl h5{font-size:24px;font-weight:300;letter-spacing:-.03em;margin-top:6px;line-height:1.15}
.s-tl p{font-size:15px;color:rgba(255,255,255,.6);margin-top:10px;font-weight:300}
/* coverage */
.s-cov{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.s-cov .img{border-radius:30px;overflow:hidden;aspect-ratio:16/12}
.s-cov .img img{width:100%;height:100%;object-fit:cover}
.s-boros{display:flex;flex-wrap:wrap;gap:12px 26px;margin-top:28px;font-size:19px}
.s-boros span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ice);margin-right:10px;transform:translateY(-2px)}
/* reviews */
.s-rev{display:grid;grid-template-columns:1.2fr .8fr;gap:60px;margin-top:50px;align-items:start}
.s-rev blockquote{font-size:48px;line-height:1.06;letter-spacing:-.045em;font-weight:300}
.s-rev blockquote:before{content:"“";display:block;color:var(--ice);font-size:90px;line-height:.6;font-weight:600;margin-bottom:14px}
.s-rev ul{list-style:none;border-top:1px solid var(--line)}
.s-rev li{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);font-size:16px;color:var(--mute)}
.s-rev li:first-child{color:var(--ink);font-weight:500}
/* compare */
.s-cmp{margin-top:50px;display:grid}
.s-cmp div{display:grid;grid-template-columns:1fr 1.2fr 1.2fr}
.s-cmp span{padding:18px 22px;border-top:1px solid var(--line);font-size:17px}
.s-cmp span:nth-child(1){color:var(--mute);font-size:14px;padding-left:0}
.s-cmp span:nth-child(2){color:#9AA1AE;font-weight:300}
.s-cmp span:nth-child(3){background:var(--ink);color:#fff}
.s-cmp div:first-child span{border-top:0;font-size:14px;font-weight:500}
.s-cmp div:first-child span:nth-child(3){border-radius:20px 20px 0 0}
.s-cmp div:last-child span:nth-child(3){border-radius:0 0 20px 20px}
/* stats */
.s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.s-stats div{border-left:1px solid var(--line);padding-left:20px}
.s-stats b{font-size:60px;letter-spacing:-.05em;display:block;line-height:1}
.s-stats span{color:var(--mute);font-size:15px;display:block;margin-top:10px}
/* form */
.s-quote{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:start}
.s-form{background:#fff;border-radius:30px;padding:34px;box-shadow:0 40px 90px -40px rgba(10,15,28,.35)}
.s-form .pr{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.s-form .pb{height:4px;border-radius:9px;background:var(--line);margin:12px 0 26px;overflow:hidden}
.s-form .pb i{display:block;width:20%;height:100%;background:var(--ice)}
.s-form h4{font-size:28px;font-weight:300;letter-spacing:-.03em}
.s-form .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.s-form .cards span{border:1px solid var(--line);border-radius:16px;padding:17px 18px;font-size:15px}
.s-form .s-btn{float:right;margin-top:22px;height:50px}
.s-form:after{content:"";display:block;clear:both}
/* faq */
.s-faq{display:grid;grid-template-columns:.8fr 1.2fr;gap:70px}
.s-faq ul{list-style:none;border-top:1px solid var(--line)}
.s-faq li{padding:22px 0;border-bottom:1px solid var(--line);font-size:18px;display:flex;justify-content:space-between}
.s-faq li:after{content:"+";color:var(--mute)}
.s-faq li.o{display:block}
.s-faq li.o:after{content:none}
.s-faq li.o p{font-size:15px;color:var(--mute);margin-top:10px;font-weight:300}
/* cta */
.s-cta{position:relative;padding:170px 0;text-align:center;color:#fff;background:var(--ink);overflow:hidden}
.s-cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.35}
.s-cta .w{position:relative}
.s-cta h2{font-size:96px;letter-spacing:-.055em;font-weight:300;line-height:1}
.s-cta p{font-size:19px;color:rgba(255,255,255,.75);margin-top:20px}
.s-cta .s-ctas{justify-content:center}
/* footer */
.s-foot{background:var(--ink);color:rgba(255,255,255,.6);padding:80px 0 60px;font-size:14px}
.s-foot .g{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:30px}
.s-foot h6{color:#fff;font-size:14px;font-weight:500;margin-bottom:14px}
.s-foot li{list-style:none;margin-bottom:9px}
.s-foot .tel{font-size:30px;color:#fff;font-weight:300;letter-spacing:-.03em;margin-top:18px}
/* template hero */
.s-th{position:relative;min-height:760px;display:flex;align-items:flex-end;color:#fff;background:var(--ink);overflow:hidden}
.s-th>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-th:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,28,.5),rgba(10,15,28,.2) 40%,rgba(10,15,28,.9)),linear-gradient(90deg,rgba(10,15,28,.6),transparent 70%)}
.s-th .w{position:relative;z-index:2;padding-bottom:80px;width:100%}
.s-crumb{font-size:14px;opacity:.65;margin-bottom:20px}
.s-th h1{font-weight:300}
.s-th .s-big{font-size:96px;max-width:15ch;display:block}
/* steps row */
.s-row{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;margin-top:56px;position:relative}
.s-row:before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:linear-gradient(90deg,var(--ice),#CFDDFF)}
.s-row div{position:relative;padding-top:42px}
.s-row div:before{content:"";position:absolute;left:0;top:0;width:19px;height:19px;border-radius:50%;background:#fff;border:6px solid #fff;box-shadow:inset 0 0 0 30px var(--ice),0 0 0 1px var(--ice)}
.s-row small{font-size:13px;color:var(--mute)}
.s-row h5{font-size:26px;font-weight:400;letter-spacing:-.03em;margin-top:6px}
.s-row p{color:var(--mute);margin-top:8px;font-size:15px;font-weight:300}
/* phone (container queries) */
@container (max-width:700px){
  .site .w{padding:0 22px}
  .s-sec{padding:72px 0}
  .s-h2{font-size:36px}
  .s-nav{left:12px;right:12px;top:12px;padding:10px 10px 10px 18px}
  .s-nav nav,.s-nav .s-btn{display:none}
  .s-nav:after{content:"";width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.18);margin-left:auto}
  .nav-solid .s-nav{margin:12px}
  .s-hero{min-height:0}
  .s-hero .in{grid-template-columns:1fr;padding:120px 22px 40px;gap:28px}
  .s-big,.s-th .s-big{font-size:48px}
  .s-sub{font-size:17px}
  .s-ctas{flex-direction:column}.s-ctas .s-btn{justify-content:center}
  .s-trust{flex-direction:column;gap:10px;padding:22px}
  .s-logos .r{flex-wrap:wrap;gap:16px 30px;font-size:17px;padding:0 20px}
  .s-stmt{font-size:30px}
  .s-phases,.s-tl,.s-row,.s-stats{grid-template-columns:1fr;gap:0}
  .s-phases div,.s-tl div,.s-row div,.s-stats div{border-left:0;padding:18px 0;border-bottom:1px solid var(--line)}
  .s-phases .k{font-size:44px}
  .s-tl div{border-bottom-color:rgba(255,255,255,.14)}
  .s-row:before{display:none}.s-row div:before{display:none}
  .s-clock,.s-svc,.s-cov,.s-rev,.s-quote,.s-faq{grid-template-columns:1fr;gap:34px}
  .s-cc .t{font-size:44px}
  .s-facts{flex-direction:column;gap:14px}
  .s-svc li{font-size:22px;padding:16px 0}
  .s-rev blockquote{font-size:30px}
  .s-cmp div{grid-template-columns:1fr}
  .s-cmp div:first-child{display:none}
  .s-cmp span{border-top:0;padding:4px 0;background:none!important;color:var(--ink)!important}
  .s-cmp span:nth-child(1){padding-top:16px;border-top:1px solid var(--line)}
  .s-cmp span:nth-child(2){text-decoration:line-through;color:#9AA1AE!important}
  .s-form{padding:22px}.s-form .cards span{padding:13px 12px;font-size:14px}
  .s-cta{padding:90px 0}.s-cta h2{font-size:44px}
  .s-foot .g{grid-template-columns:1fr 1fr}
  .s-th{min-height:640px}
}

/* ---------- mobile editor ---------- */
.dock{display:none}
.sheet-x{display:none}
@media (max-width:980px){
  .crumb,.avs,.bp,#previewBtn,.slop-chip .t1{display:none}
  .slop-chip{padding:6px 9px}
  .banner{flex-wrap:wrap}.banner .btn{margin-left:0!important}
  .top{gap:8px;padding:0 10px}
  .brand small{display:none}
  .modes{overflow-x:auto;margin:0;flex:1;scrollbar-width:none}
  .modes::-webkit-scrollbar{display:none}
  .modes button{padding:6px 10px}
  .modes svg{display:none}
  .top-r .btn-blue{padding:0 10px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;right:0;bottom:0;height:72vh;z-index:40;border:0;border-top:1px solid var(--line2);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);box-shadow:0 -30px 60px rgba(0,0,0,.5)}
  .side.r{border-left:0}
  .side.open{transform:none}
  .sheet-x{display:flex;justify-content:center;padding:8px 0 0}
  .sheet-x span{width:40px;height:4px;border-radius:9px;background:#3A3D47}
  .board-wrap{padding:30px 14px 140px}
  .dock{display:flex;position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:35;background:rgba(24,25,30,.92);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:16px;padding:6px;gap:4px}
  .dock button{flex:1;padding:10px 0;border-radius:11px;color:var(--tx2);font-weight:500;font-size:12.5px}
  .dock button.on{background:var(--blue);color:#fff}
  .layer .mv{display:flex}.layer .grip{display:none}
  .zoom{display:none}
  .dv,.dv3{grid-template-columns:1fr}
  .dv>.side,.dv3>.side{display:none}
  .dv3 .drawer{position:fixed;inset:auto 0 0 0;height:70vh;z-index:40;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .4s var(--ease);border-left:0;border-top:1px solid var(--line2)}
  .dv3 .drawer.open{transform:none}
  .dv-main{padding:20px 16px 120px}
  .coll-m{display:flex!important}
  .tbl .hide-m{display:none}
  .voc div{grid-template-columns:1fr}.voc div>i{display:none}
  .fw-grid{grid-template-columns:1fr}
  .flow{flex-direction:column}.arrow{width:auto;height:22px;transform:rotate(90deg)}
}
.coll-m{display:none;gap:6px;overflow-x:auto;margin-top:14px}
.coll-m button{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.coll-m button.on{background:var(--panel2);color:#fff;border-color:#3A3D47}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Azends<i></i><small>Studio</small></div>
  <div class="crumb"><span class="proj-dot"><svg width="12" height="12" viewBox="0 0 32 32" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13"/></svg></span><b>Novus Maintenance</b><span>/</span><span id="crumbPage">Home</span></div>
  <nav class="modes" id="modes">
    <button data-m="design" class="on"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M2 6h12M6 6v8"/></svg>Design</button>
    <button data-m="cms"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="8" cy="4" rx="5.5" ry="2"/><path d="M2.5 4v8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2V4M2.5 8c0 1.1 2.5 2 5.5 2s5.5-.9 5.5-2"/></svg>CMS</button>
    <button data-m="copy"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 13l2-.5L13 4.5 11.5 3 3.5 11 3 13zM10 4.5 11.5 6"/></svg>Copy Lab</button>
    <button data-m="seo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>SEO</button>
    <button data-m="leads"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2 3h12l-4.5 5.5V13l-3-1.5V8.5L2 3z"/></svg>Leads</button>
  </nav>
  <div class="top-r">
    <div class="slop-chip" id="slopChip"><i></i><span class="t1">Slop check</span><span class="t2" id="slopN">0 flags</span></div>
    <div class="bp" id="bp">
      <button data-bp="desktop" title="Desktop"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5"/></svg></button>
      <button data-bp="phone" title="Phone"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4.5" y="1.5" width="7" height="13" rx="1.8"/><path d="M7.3 12.3h1.4"/></svg></button>
    </div>
    <div class="avs"><span class="av" style="background:#FFE600;color:#0A0F1C">M</span><span class="av" style="background:#1F5EFF;color:#fff">N</span></div>
    <a class="btn btn-ghost" id="previewBtn" href="https://azends-demos.vercel.app/novus" target="_blank" rel="noopener">Preview</a>
    <button class="btn btn-blue" id="publishBtn">Publish</button>
  </div>
</header>

<div class="app" id="app">
  <!-- DESIGN -->
  <aside class="side" id="left">
    <div class="sheet-x"><span></span></div>
    <div class="tabs" id="ltabs"><button data-t="pages" class="on">Pages</button><button data-t="layers">Layers</button><button data-t="insert">Insert</button></div>
    <div class="scroll" id="lbody"></div>
  </aside>
  <main class="canvas" id="canvas">
    <div class="board-wrap" id="boardWrap">
      <div class="board-label"><b id="boardName">Home</b><span id="boardSize">Desktop · 1440</span></div>
      <div class="board-hold" id="hold"><div class="board site" id="board"></div><div class="drop-line" id="dropLine" data-l="Drop here"></div></div>
    </div>
    <div class="zoom" id="zoom"><button data-z="fit" class="on">Fit</button><button data-z="0.5">50%</button><button data-z="1">100%</button></div>
  </main>
  <aside class="side r" id="right">
    <div class="sheet-x"><span></span></div>
    <div id="insp" style="display:flex;flex-direction:column;min-height:0;flex:1"></div>
  </aside>
</div>

<!-- DATA VIEWS -->
<div class="app full" id="views" style="display:none">
  <section class="view dv3" id="v-cms">
    <aside class="side"><div class="scroll" id="cmsSide"></div></aside>
    <div class="dv-main" id="cmsMain"></div>
    <aside class="drawer" id="cmsDrawer"></aside>
  </section>
  <section class="view" id="v-copy"><div class="dv-main" id="copyMain"></div></section>
  <section class="view dv3" id="v-seo" style="grid-template-columns:1fr 380px"><div class="dv-main" id="seoMain"></div><aside class="drawer" id="seoDrawer"></aside></section>

/* ============================================================ SLOP CHECK */
function sylls(w){ w=w.toLowerCase().replace(/[^a-z]/g,""); if(!w) return 0; if(w.length<=3) return 1; w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,"").replace(/^y/,""); const m=w.match(/[aeiouy]{1,2}/g); return m?m.length:1; }
function grade(t){ const s=Math.max(1,(t.match(/[.!?]+/g)||[]).length); const ws=t.split(/\s+/).filter(x=>/[a-z]/i.test(x)); if(!ws.length) return 0; const sy=ws.reduce((a,w)=>a+sylls(w),0); return Math.max(1,0.39*(ws.length/s)+11.8*(sy/ws.length)-15.59); }
function scan(t){
  const f=[], low=t.toLowerCase();
  HYPE.forEach(h=>{ if(low.includes(h)) f.push(`Hype word: "${h}"`); });
  if(/—|–/.test(t)) f.push("Em dash found");
  if(t.includes("!")) f.push("Exclamation mark");
  if(/\bisn'?t\b[^.]{0,40},\s*it'?s\b/i.test(t) || /\bnot just\b/i.test(t)) f.push("\"It isn't X, it's Y\" framing");
  if(/\byour home\b|\bhomeowners?\b|\bdriveway at home\b/i.test(t)) f.push("Residential language");
  return f;
}

}

function dropTarget(clientY){
  const s=+hold.dataset.s||1, els=[...board.querySelectorAll(".blk")].filter(el=>el.offsetHeight>0);

    h+=`<div class="field"><label>Respects reduced motion</label><div class="pill"><i></i>On</div></div>`;
    if(fixed) h+=`<p class="empty" style="padding:6px 0">This section manages its own background and spacing.</p>`;

function fwCard(keys){ if(!keys) return ""; return keys.map(k=>{ const f=FW[k]; return `<div class="fw"><div class="fw-top"><span class="who">${f.who}</span><div><b>${f.name}</b><small>${f.tag}</small></div></div><p>${f.why}</p></div>`; }).join(""); }
function slopBox(text){
  const flags=scan(text), g=grade(text).toFixed(1);
  const rows=[
    [!flags.some(f=>f.startsWith("Hype")),"No hype words"],
    [!flags.includes("Em dash found"),"No em dashes"],
    [!flags.includes("Exclamation mark"),"No exclamation marks"],
    [!flags.some(f=>f.includes("isn't")),"No \"it isn't X, it's Y\" lines"],
    [g<=8,`Reading level: grade ${g}`],
  ];
  return `<div class="chk"><div class="chk-h"><span>Slop check</span><span class="pill ${flags.length?"y":""}"><i></i>${flags.length?flags.length+" to fix":"Clean"}</span></div><div class="chk-l">${rows.map(([ok,t])=>`<div><span class="d ${ok?"ok":"no"}">${ok?"✓":"!"}</span>${t}</div>`).join("")}${flags.filter(f=>f.startsWith("Hype")).map(f=>`<div><span class="d no">!</span>${esc(f)}</div>`).join("")}</div></div>`;
}

document.getElementById("v-cms").addEventListener("input", e=>{
  const k=e.target.dataset.cf; if(!k) return; const it=CMS[S.cmsColl].items[S.cmsItem]; it[k]=e.target.value;
  const row=document.querySelector(`#cmsMain tr[data-item="${S.cmsItem}"]`); if(row){ row.cells[0].innerHTML=`<b>${esc(it.name)}</b>`; if(row.cells[2]) row.cells[2].innerHTML=rich(esc(it.title)); }
  const box=document.querySelector("#cmsDrawer .chk"); if(box) box.outerHTML=slopBox(it.title.replace(/\*/g,"")+". "+it.sub);
  updateSlop();
});

/* ---------- COPY LAB ---------- */
function renderCopy(){
  const voc=[["I never heard from them until it started snowing","Your borough crew is staged 24 to 48 hours out."],["They were stretched too thin","Commercial only, so crews aren't split across driveways."],["Tenants keep calling me about the entrance","Ready-by times written into every site plan."],["They just salted the ice the next morning","Surfaces treated before the first flake."]];
  document.getElementById("copyMain").innerHTML=`<h1>Copy Lab</h1><p class="lead">Nothing on this site is written from a blank page. Every line starts from a framework used by the best direct-response copywriters, then we swap in Novus facts. Tap a card to flip between the framework and the line we shipped.</p>
  <div class="fw-grid">${Object.entries(FW).map(([k,f])=>`<div class="card" data-fw="${k}"><div class="card-h"><span class="who">${f.who}</span><div><b>${f.name}</b><small>${f.tag}</small></div></div><p class="why">${f.why}</p><div class="out">${S.fwFlip[k]?`<span class="mono" style="font-size:12.5px;color:var(--tx2)">${tplHTML(f.tpl)}</span>`:f.out}</div><button class="flip">${S.fwFlip[k]?"Show the Novus line →":"Show the framework →"}</button><div class="used">${f.used.map(u=>`<span>${u}</span>`).join("")}</div></div>`).join("")}</div>
  <div class="h2">Voice of customer bank<small>Pain written in the words property managers use online</small></div>
  <div class="voc">${voc.map(([a,b])=>`<div><q>${esc(a)}</q><i style="color:var(--tx3);font-style:normal;text-align:center">→</i><span>${esc(b)}</span></div>`).join("")}</div>
  <div class="h2">Slop filter<small>Runs on every field before anything can publish</small></div>
  <div class="rules">${RULES.map(([t,d])=>`<div class="rule"><span class="d ok" style="width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none;margin-top:1px">✓</span><div><b>${t}</b><small>${d}</small></div></div>`).join("")}</div>
  <div class="h2">Try it<small>Paste any line and run it through the filter</small></div>
  <div class="try"><textarea id="tryIn">We provide seamless, world-class snow removal solutions — unlock peace of mind today!</textarea></div><div class="try-out" id="tryOut"></div>`;
  runTry();
}
function runTry(){ const t=document.getElementById("tryIn"); if(!t) return; document.getElementById("tryOut").innerHTML=slopBox(t.value); }
document.getElementById("copyMain").addEventListener("click", e=>{ const c=e.target.closest("[data-fw]"); if(!c) return; S.fwFlip[c.dataset.fw]=!S.fwFlip[c.dataset.fw]; const sc=document.getElementById("copyMain").scrollTop; renderCopy(); document.getElementById("copyMain").scrollTop=sc; });
document.getElementById("copyMain").addEventListener("input", e=>{ if(e.target.id==="tryIn") runTry(); });

/* ---------- SEO ---------- */
function renderSEO(){
  const P=allPages();
  document.getElementById("seoMain").innerHTML=`<h1>SEO</h1><p class="lead">${P.length} pages, each with its own title, description and structured data. Sitemap, robots.txt and llms.txt are generated on every publish.</p>
  <div class="banner" style="background:linear-gradient(90deg,rgba(52,211,153,.1),rgba(47,123,255,.06));border-color:rgba(52,211,153,.25)"><div class="big">${P.length}</div><div><b>Indexable pages</b><br><span style="color:var(--tx2)">Server-rendered, so Google reads the full page on the first visit.</span></div><div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap"><span class="pill"><i></i>sitemap.xml</span><span class="pill"><i></i>robots.txt</span><span class="pill"><i></i>llms.txt</span></div></div>
  <table class="tbl"><thead><tr><th>Page</th><th class="hide-m">Target keyword</th><th>Title</th><th class="hide-m">Schema</th></tr></thead><tbody>${P.map((p,i)=>`<tr data-seo="${i}" class="${i===S.seoSel?"on":""}"><td><b>${esc(p.name)}</b><div class="mono" style="font-size:11px;color:var(--tx3);margin-top:2px">${p.path}</div></td><td class="hide-m">${esc(p.kw)||"<span style='color:var(--tx3)'>·</span>"}</td><td>${p.seo?`<span class="cnt ${p.seo.length<=65?"ok":"warn"} mono">${p.seo.length} ch</span>`:"<span class='pill b'><i></i>Index</span>"}</td><td class="hide-m">${p.schema.map(s=>`<span class="pill p" style="margin:0 4px 4px 0">${s}</span>`).join("")}</td></tr>`).join("")}</tbody></table>`;
  const p=P[S.seoSel];
  document.getElementById("seoDrawer").innerHTML=`<div class="insp-h"><span class="ic" style="background:rgba(52,211,153,.12);color:var(--green)">${IC.page}</span><div><b>${esc(p.name)}</b><small class="mono">${p.path}</small></div></div><div class="scroll" style="padding:14px"><div class="field"><label>Google preview</label><div class="serp"><div class="u"><i>N</i>novusmaintenance.com${p.path==="/"?"":" › "+p.path.replace(/^\//,"").split("/").join(" › ")}</div><div class="t">${esc(p.seo||p.name+" | Novus Maintenance")}</div><div class="d">${esc(p.desc||"Overview page linking to every "+p.name.replace(" (index)","").toLowerCase()+" page.")}</div></div></div><div class="field"><label>Target keyword</label><input value="${esc(p.kw)}"></div><div class="field"><label>Structured data</label><div style="display:flex;flex-wrap:wrap;gap:6px">${p.schema.map(s=>`<span class="pill p"><i></i>${s}</span>`).join("")}</div></div><div class="field"><label>Internal links in</label><div class="tpl" style="border-style:solid">Navigation · Footer · Related services · Breadcrumbs</div></div></div>`;
}
document.getElementById("v-seo").addEventListener("click", e=>{ const r=e.target.closest("[data-seo]"); if(!r) return; S.seoSel=+r.dataset.seo; const sc=document.getElementById("seoMain").scrollTop; renderSEO(); document.getElementById("seoMain").scrollTop=sc; if(window.innerWidth<980) document.getElementById("seoDrawer").scrollIntoView(); });

/* ---------- LEADS ---------- */

  <tr><td><b>Boroughs</b></td><td>Manhattan, Brooklyn</td><td class="hide-m">Which borough crew owns it</td></tr>

  <tr><td><b>Source page</b></td><td class="mono" style="font-size:11.5px">/services/pre-storm-anti-icing</td><td class="hide-m">Which page and keyword brought them in</td></tr>
  <tr><td><b>Contact</b></td><td>Name, company, email, phone</td><td class="hide-m">Validated before it can send</td></tr>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px">${["New","Contacted","Quoted","Won"].map((s,i)=>`<div class="card" style="padding:12px;gap:8px"><div style="display:flex;justify-content:space-between"><b style="font-weight:500">${s}</b><span class="pill ${["b","y","p",""][i]}"><i></i>0</span></div><div style="border:1px dashed var(--line2);border-radius:10px;padding:14px;color:var(--tx3);font-size:12px;text-align:center">${i===0?"New quote requests land here":"Drag cards here"}</div></div>`).join("")}</div>`;

/* ============================================================ MOBILE SHEETS */
const left=document.getElementById("left"), right=document.getElementById("right");
function openSheet(which){
  closeSheets(true);
  if(which==="edit"){ right.classList.add("open"); }
  else { S.ltab=which; renderLeft(); left.classList.add("open"); }
  document.querySelectorAll("#dock button").forEach(b=>b.classList.toggle("on", b.dataset.d===which));
}
function closeSheets(keepDock){ left.classList.remove("open"); right.classList.remove("open"); document.getElementById("cmsDrawer").classList.remove("open"); if(!keepDock) document.querySelectorAll("#dock button").forEach(b=>b.classList.remove("on")); }
document.getElementById("dock").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; if(b.classList.contains("on")) closeSheets(); else openSheet(b.dataset.d); });
document.querySelectorAll(".sheet-x").forEach(x=>x.addEventListener("click", ()=>closeSheets()));
canvas.addEventListener("touchstart", ()=>{ if(window.innerWidth<980 && (left.classList.contains("open"))) closeSheets(); }, {passive:true});

/* ============================================================ MISC */
let tt;
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=`<span style="width:8px;height:8px;border-radius:50%;background:#34D399;display:inline-block"></span>${msg}`; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }
document.getElementById("publishBtn").addEventListener("click", ()=>{ const n=scan(HOME.map(blockText).join(". ")).length; toast(n?`Fix ${n} slop flag${n>1?"s":""} before publishing`:`Preview updated · ${allPages().length} pages, 0 slop flags`); });

document.querySelectorAll('#bp button').forEach(b=>b.classList.toggle('on',b.dataset.bp===S.bp));
renderLeft(); renderInspector(); renderBoard();
if(window.innerWidth>=980){ setTimeout(()=>{ select(HOME[1].uid, true); }, 400); }
</script>
