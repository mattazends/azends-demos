<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F7F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tidewell HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E1A1F;--ink2:#3A474D;--mute:#6B7A80;--mute2:#9AA6AB;--bg:#F3F6F7;--card:#fff;--line:#E3EAEC;--line2:#EEF3F4;
--brand:#0F4C5C;--brand2:#0A3742;--aqua:#5CE1E6;--aqua2:#2CC6CF;--aquabg:#DDF6F7;
--blue:#2E6BE0;--bluebg:#E6EEFC;--violet:#7C5CFA;--violetbg:#EFEBFF;--amber:#E39A12;--amberbg:#FFF3DC;--green:#14955A;--greenbg:#E3F5EB;
--rose:#E5484D;--rosebg:#FDE8E9;--pink:#D9539C;--pinkbg:#FCE9F3;--orange:#EB7430;--orangebg:#FDEDE2;--slate:#56656B;--slatebg:#EDF1F2;
--r:16px;--sh:0 1px 2px rgba(14,26,31,.04),0 4px 16px rgba(14,26,31,.04);--sb:252px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Figtree',-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:14px;letter-spacing:-.011em;line-height:1.4;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;font-size:inherit;text-align:inherit}
input,textarea,select{font-family:inherit;letter-spacing:inherit;color:inherit;font-size:inherit}
svg{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
/* ---------- shell ---------- */
.app{display:flex;height:100vh;height:100dvh}
.side{width:var(--sb);flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;z-index:40}
.sbtop{padding:18px 18px 12px;display:flex;align-items:center;gap:10px}
.lmk{display:inline-grid;place-items:center;background:var(--brand);flex-shrink:0;width:34px;height:34px;border-radius:10px}
.wm{font-weight:700;letter-spacing:-.03em;font-size:15.5px;line-height:1.05}.wm span{color:var(--brand)}.wm small{display:block;font-size:11px;color:var(--mute);font-weight:500;letter-spacing:0;margin-top:2px}
.sbsearch{margin:4px 14px 8px;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--mute);font-size:13px}
.sbsearch kbd{margin-left:auto;font-family:inherit;font-size:10.5px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.nav{flex:1;overflow-y:auto;padding:4px 10px 14px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
.ng{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--mute2);padding:14px 10px 6px}
.ni{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:10px;font-weight:500;color:var(--ink2);font-size:13.5px;transition:background .15s}
.ni:hover{background:var(--bg)}
.ni .dot{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.ni.on{background:var(--aquabg);color:var(--brand2);font-weight:650}
.ni.off{opacity:.42;cursor:default}.ni.off:hover{background:none}
.ni .bg{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--rose);color:#fff}
.ni .bg.g{background:var(--line);color:var(--ink2)}
.ni .lk{margin-left:auto;color:var(--mute2)}
.sbme{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{height:64px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(243,246,247,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.025em}
.top .sub{color:var(--mute);font-size:13px;margin-left:4px}
.top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);position:relative;color:var(--ink2)}
.ib .rd{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--rose);border:2px solid #fff}
.menu{display:none}
.view{flex:1;overflow-y:auto;padding:24px 26px 60px;-webkit-overflow-scrolling:touch}
.wrap{max-width:1320px;margin:0 auto}
/* ---------- atoms ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line2)}
.cp{padding:18px 20px}
.ch{display:flex;align-items:center;gap:10px;padding:16px 20px 0}
.ch h3{font-size:15px;font-weight:700;letter-spacing:-.02em}
.ch .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lnk{color:var(--brand);font-weight:600;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--brand);color:#fff}.btn.p:hover{filter:brightness(1.12)}
.btn.a{background:var(--aqua);color:var(--brand2)}
.btn.g{background:#fff;border:1px solid var(--line)}
.btn.s{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.t-blue{background:var(--bluebg);color:var(--blue)}.t-violet{background:var(--violetbg);color:var(--violet)}.t-amber{background:var(--amberbg);color:#B87400}.t-green{background:var(--greenbg);color:var(--green)}
.t-rose{background:var(--rosebg);color:var(--rose)}.t-pink{background:var(--pinkbg);color:var(--pink)}.t-orange{background:var(--orangebg);color:var(--orange)}.t-slate{background:var(--slatebg);color:var(--slate)}.t-aqua{background:var(--aquabg);color:var(--brand)}
.av{display:inline-grid;place-items:center;border-radius:50%;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:0}
.avs{display:flex}.avs .av{border:2px solid #fff;margin-left:-7px}.avs .av:first-child{margin-left:0}
.muted{color:var(--mute)}.small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:700}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g21{display:grid;grid-template-columns:1.65fr 1fr;gap:14px}
.mt{margin-top:14px}.mt20{margin-top:20px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi .l{font-size:12.5px;color:var(--mute);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.035em;margin-top:8px}
.kpi .d{font-size:12px;margin-top:4px;color:var(--mute)}
.up{color:var(--green);font-weight:650}.dn{color:var(--rose);font-weight:650}
.kpi .spark{position:absolute;right:14px;bottom:14px}
.hero{border-radius:20px;background:linear-gradient(135deg,#0F4C5C 0%,#0A3742 60%,#082C35 100%);color:#fff;padding:22px 24px;position:relative;overflow:hidden}
.hero .loop{position:absolute;right:-40px;top:-30px;width:300px;opacity:.22;pointer-events:none}
.hero h2{font-size:24px;font-weight:700;letter-spacing:-.03em}
.hero p{color:rgba(255,255,255,.72);margin-top:4px}
.hstats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap;position:relative}
.hstats div b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em}
.hstats div span{font-size:12px;color:rgba(255,255,255,.62)}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* list rows */
.rows .rw{display:grid;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line2);cursor:pointer;transition:background .12s}
.rows .rw:hover{background:#FAFCFC}
.rows .hd{display:grid;gap:12px;padding:10px 20px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute2)}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who>div{min-width:0}
.who .n{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:var(--aqua2)}
.tog{width:40px;height:24px;border-radius:20px;background:#D5DDE0;position:relative;transition:background .2s;flex-shrink:0}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.6,1)}
.tog.on{background:var(--green)}.tog.on::after{transform:translateX(16px)}
.thumb{border-radius:12px;background:linear-gradient(135deg,#2A6E7E,#0A3742);overflow:hidden;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--green)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(20,149,90,.45)}100%{box-shadow:0 0 0 8px rgba(20,149,90,0)}}
.fade{animation:fd .35s ease both}@keyframes fd{from{opacity:0;transform:translateY(6px)}}
/* feed */
.feed .it{display:flex;gap:12px;padding:11px 20px;border-top:1px solid var(--line2)}
.feed .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.feed .tx{flex:1;min-width:0;font-size:13px}.feed .tx b{font-weight:650}
.feed .tm{font-size:11.5px;color:var(--mute2);white-space:nowrap}
.feed .new{animation:nw 1.2s ease}@keyframes nw{from{background:var(--aquabg)}}
/* kanban */
.kb{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;scroll-snap-type:x mandatory}
.col{width:272px;flex-shrink:0;background:#E9EEF0;border-radius:16px;padding:10px;scroll-snap-align:start}
.col.over{background:var(--aquabg);outline:2px dashed var(--aqua2)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colh .cd{width:8px;height:8px;border-radius:50%}
.colh b{font-size:13px}.colh .c{font-size:12px;color:var(--mute);font-weight:600}.colh .v{margin-left:auto;font-size:12px;font-weight:650;color:var(--ink2)}
.lc{background:#fff;border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:grab;transition:box-shadow .15s,transform .15s;border:1px solid transparent}
.lc:hover{box-shadow:0 6px 18px rgba(14,26,31,.08)}
.lc.drag{opacity:.4}
.lc .tp{display:flex;align-items:center;gap:8px}
.lc .nm{font-weight:650;font-size:13.5px}.lc .tw{font-size:12px;color:var(--mute)}
.lc .val{margin-left:auto;font-weight:700;font-size:13.5px}
.lc .mt8{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.lc .ft{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--mute)}
.lc .hot{color:var(--rose);font-weight:650}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(10,20,24,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
.ov.in{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:100%;background:var(--bg);z-index:90;transform:translateX(102%);transition:transform .42s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.12)}
.dr.in{transform:none}
.drh{display:flex;align-items:center;gap:12px;padding:16px 20px;background:#fff;border-bottom:1px solid var(--line)}
.drb{flex:1;overflow-y:auto;padding:18px 20px 40px}
.drf{padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}
.drf .btn{flex:1}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2);border-radius:14px;overflow:hidden}
.kv div{background:#fff;padding:11px 14px}.kv span{display:block;font-size:11.5px;color:var(--mute)}.kv b{font-weight:650;font-size:13.5px}
.tl{position:relative;padding-left:22px}
.tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .e{position:relative;padding:0 0 14px}
.tl .e::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--aqua2)}
.tl .e.k::before{background:var(--aqua2)}
.tl .e b{font-weight:650}.tl .e .tm{font-size:11.5px;color:var(--mute2)}
.stp{display:flex;gap:3px}.stp i{flex:1;height:5px;border-radius:4px;background:var(--line)}.stp i.d{background:var(--aqua2)}.stp i.c{background:linear-gradient(90deg,var(--aqua2) 50%,var(--line) 50%)}
/* calendar */
.calw{overflow-x:auto}
.cal{min-width:980px;display:grid;grid-template-columns:168px repeat(7,1fr)}
.cal .hc{padding:10px 8px;font-size:12px;font-weight:650;color:var(--mute);border-bottom:1px solid var(--line);text-align:center}
.cal .hc.td{color:var(--brand)}.cal .hc.td b{background:var(--brand);color:#fff;border-radius:7px;padding:1px 7px}
.cal .hc b{display:inline-block;font-size:15px;color:var(--ink);margin-top:2px}
.cal .wx{padding:6px;font-size:11.5px;text-align:center;border-bottom:1px solid var(--line);color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
.cal .wx.bad{background:#FFF7F7;color:var(--rose);font-weight:650}
.cal .rh{padding:12px 14px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:9px;font-weight:650;font-size:13px}
.cal .cell{border-bottom:1px solid var(--line2);border-left:1px solid var(--line2);padding:5px;min-height:74px;position:relative}
.cal .cell.td{background:#F6FDFD}
.ev{border-radius:9px;padding:6px 8px;font-size:11.5px;line-height:1.3;margin-bottom:4px;cursor:pointer;border-left:3px solid}
.ev b{display:block;font-weight:650;font-size:12px}
/* inbox */
.inb{display:grid;grid-template-columns:340px 1fr;height:calc(100dvh - 64px - 48px);min-height:520px}
.thl{border-right:1px solid var(--line);overflow-y:auto}
.th{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.th.on{background:var(--aquabg)}.th .un{position:absolute;right:16px;top:36px;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.th .tx{flex:1;min-width:0}.th .tx .n{display:flex;gap:6px;align-items:center;font-weight:650}.th .tx .n .tm{margin-left:auto;font-size:11.5px;color:var(--mute2);font-weight:500}
.th .tx .p{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chan{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;color:#fff}
.tv{display:flex;flex-direction:column;min-width:0}
.tvh{display:flex;align-items:center;gap:11px;padding:13px 18px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;background:#FAFCFC}
.mg{max-width:74%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.42}
.mg.them{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px}
.mg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.mg.bot{background:var(--violetbg);color:#3D2B99;align-self:flex-end;border-bottom-right-radius:5px}
.mg .mt{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.sysm{align-self:center;font-size:11.5px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 11px;display:flex;gap:6px;align-items:center}
.cmp{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.cmp input{flex:1;height:40px;border-radius:12px;border:1px solid var(--line);padding:0 13px;outline:none;background:#fff}
.cmp input:focus{border-color:var(--aqua2)}
.aisug{margin:0 14px;padding:10px 12px;border-radius:12px;background:var(--violetbg);font-size:12.5px;color:#3D2B99;display:flex;gap:9px;align-items:flex-start;cursor:pointer}
/* automations */
.au{display:flex;align-items:center;gap:14px;padding:14px 20px;border-top:1px solid var(--line2);cursor:pointer}
.au .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.au .tx{flex:1;min-width:0}.au .tx b{font-weight:650}
.au .st{text-align:right;font-size:12px;color:var(--mute);min-width:110px}.au .st b{display:block;color:var(--ink);font-size:14px}
.flow{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 0}
.fn{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:11px;align-items:center}
.fn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0}
.fn small{display:block;color:var(--mute);font-size:12px}
.fl{width:2px;height:22px;background:var(--line);position:relative}
.fl::after{content:'';position:absolute;left:-3px;bottom:-1px;border:4px solid transparent;border-top-color:var(--mute2)}
.fl.go{background:linear-gradient(var(--aqua2),var(--aqua2)) no-repeat;background-size:2px 0;animation:fg 1.2s ease forwards}
@keyframes fg{to{background-size:2px 100%}}
/* pools */
.pl{padding:14px;position:relative}
.pl .tmp{font-size:30px;font-weight:700;letter-spacing:-.04em}
.pl .tmp small{font-size:14px;color:var(--mute);font-weight:500}
.pl .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pl .mini div{background:var(--bg);border-radius:9px;padding:6px 8px;font-size:11px;color:var(--mute)}.pl .mini b{display:block;font-size:13px;color:var(--ink)}
.pl.alert{box-shadow:0 0 0 2px var(--rose) inset,var(--sh)}
.pl .wv{position:absolute;right:12px;top:12px}
/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:11px 16px 11px 12px;border-radius:14px;display:flex;align-items:center;gap:10px;z-index:200;transition:all .35s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 12px 40px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--aqua);color:var(--brand2);flex-shrink:0}
.toast b{font-weight:650;display:block;font-size:13.5px}.toast span{font-size:12px;opacity:.7}
.bnav{display:none}
.mtop{display:none}
.ttl{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ttl h2{font-size:24px;font-weight:700;letter-spacing:-.03em}
.ttl p{color:var(--mute);margin-top:2px}
.ttl .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.stars{color:#F5B400;letter-spacing:1px}
/* ---------- responsive ---------- */
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:1fr}}
@media(max-width:860px){
  body{font-size:14.5px}

function bars(data,o={}){ // data: [[label, v1, v2?]]

  let g='';for(let v=0;v<=mx;v+=step){const y=H-pb-(v/mx)*(H-pb-8);g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#EEF3F4"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="#9AA6AB" font-family="Figtree,-apple-system,Arial,sans-serif">${o.fmt?o.fmt(v):v}</text>`}
  const two=data[0].length>2,b=two?bw*.28:bw*.46;
  const r=data.map((d,i)=>{const x=pl+i*bw+bw/2,h1=(d[1]/mx)*(H-pb-8),h2=two?(d[2]/mx)*(H-pb-8):0,hl=o.hl===i;
    return `${two?`<rect x="${x-b-2}" y="${H-pb-h1}" width="${b}" height="${h1}" rx="4" fill="${o.c1||'#0F4C5C'}" ${hl?'':'opacity=".9"'}><animate attributeName="height" from="0" to="${h1}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${H-pb}" to="${H-pb-h1}" dur=".7s" fill="freeze"/></rect><rect x="${x+2}" y="${H-pb-h2}" width="${b}" height="${h2}" rx="4" fill="${o.c2||'#5CE1E6'}"><animate attributeName="height" from="0" to="${h2}" dur=".7s" fill="freeze"/><animate attributeName="y" from="${H-pb}" to="${H-pb-h2}" dur=".7s" fill="freeze"/></rect>`

      <text x="${x}" y="${H-7}" text-anchor="middle" font-size="10.5" fill="${hl?'#0E1A1F':'#9AA6AB'}" font-weight="${hl?700:500}" font-family="Figtree,-apple-system,Arial,sans-serif">${d[0]}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}${r}</svg>`;
}
