/* ---------- report an issue ---------- */
let RP={};
A.report=()=>{RP={cat:null,urg:1,files:[]};openLayer(SH('Report an issue',`<div id="rpb">${rpBody()}</div>`,`<button class="btn p" onclick="A._rpSend()">Send to the team</button>`),{tall:true})};
function rpBody(){
  const cats=[['drop','Water looks cloudy'],['therm','Not heating'],['cover','Cover issue'],['bulb','Lights'],['alert','Leak or crack'],['help','Something else']];
  return `<div class="lbl" style="margin:0 4px 10px">What's happening?</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${cats.map(([i,t],k)=>`<button onclick="RP.cat=${k};$('#rpb').innerHTML=rpBody()" style="background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;border:1.5px solid ${RP.cat===k?'var(--brand)':'transparent'}"><span style="color:${RP.cat===k?'var(--brand)':'var(--mute)'}">${ic(i,22)}</span>${t}</button>`).join('')}</div>
  <div class="field mt16"><label>Tell us what you can see</label><textarea id="rpt" rows="3" placeholder="e.g. the water has gone a bit green near the steps"></textarea></div>
  <div class="lbl" style="margin:18px 4px 10px">A photo helps us fix it first time</div><button class="drop" onclick="A.attach('rp')"><div class="ic t-acc">${ic('camera',20)}</div><div><div style="font-weight:500">Add photos or a video</div><div class="small muted">From your camera or library</div></div></button>
  <div class="prev">${RP.files.map(s=>`<div class="ph"><img src="${s}"></div>`).join('')}</div>
  <div class="lbl" style="margin:18px 4px 10px">How urgent is it?</div><div class="seg">${['Not urgent','This week','Leaking now'].map((t,k)=>`<button class="${RP.urg===k?'on':''}" onclick="RP.urg=${k};$('#rpb').innerHTML=rpBody()">${t}</button>`).join('')}</div>
  <div class="note ok mt16">${ic('shield',16)}<div>We can see your pool controller remotely, so most issues are fixed without a visit. Covered by your guarantees.</div></div>`;
}
A._rpSend=()=>{
  if(RP.cat===null){toast('Pick what the problem is','So we send the right person','alert','warn');return}
  const ref='SN-'+(310+S.snags.length);const t=['Water looks cloudy','Not heating','Cover issue','Lights','Leak or crack','Something else'][RP.cat];
  if(S.stage==='complete'&&!S.signed)S.snags.push({ref,t});
  notify({ic:'wrench',tone:'warn',t:'Issue logged · '+ref,s:t+' · Callum is checking remotely'});
  chatPush({f:'them',who:'Callum',t:RP.urg===2?`Got your report (${ref}). I'm checking your controller now and I'll call you in 5 minutes.`:`Thanks Olivia, got it (${ref}). I've had a look remotely and I'll message you within 2 hours.`});
  const el=top_();el.querySelector('.sheet-h h3').textContent='';
  el.querySelector('.sheet-b').innerHTML=`<div class="succ"><div class="ck">${tick}</div><h2>We're on it</h2><p>${RP.urg===2?'Callum is checking your pool remotely now and will call you in 5 minutes.':'Callum will check your pool remotely and message you within 2 hours.'}</p></div><div class="summ mt20"><div class="l"><span>Reference</span><b>${ref}</b></div><div class="l"><span>Issue</span><b>${t}</b></div><div class="l"><span>Photos</span><b>${RP.files.length||'None'}</b></div><div class="l"><span>Cost to you</span><b style="color:var(--ok)">£0 · under guarantee</b></div></div>`;
  el.querySelector('.sheet-f').innerHTML=`<button class="btn p" onclick="A.close()">Done</button>`;
  if(S.tab==='home'||S.tab==='chat')render();
  const og=$('#ob');if(og){og.innerHTML=offBody();$('#of').innerHTML=offFoot()}
};

A.signoff=()=>openLayer(PG('Sign-off',`<div id="ob">${offBody()}</div>`,{foot:`<div id="of">${offFoot()}</div>`}),{type:'page'});

  <div class="list mt16">${OFFC.map(([t,img],i)=>`<button class="check ${S.offChecks[i]?'on':''}" style="align-items:center" onclick="A._off(${i})"><span class="cb">${ic('check',14,3)}</span><div class="tx" style="flex:1"><div class="t">${t}</div></div>${img?`<div style="width:50px;height:50px;border-radius:12px;overflow:hidden;flex-shrink:0" onclick="event.stopPropagation();A.galSingle('${img}')">${ph(img,'','style="width:100%;height:100%"')}</div>`:`<div class="ic sm t-mute">${ic(['swim','sparkle','therm','cover','wifi','leaf'][i],16)}</div>`}</button>`).join('')}</div>

function reply(t){t=t.toLowerCase();const lead=S.stage==='quote'?'Tom':'Callum';

  if(id.startsWith('rc:')){
    const r=S.receipts[+id.slice(3)];if(!r)return[''];const t=totals();
    return [`${LH('Receipt',r.ref+' · '+JOB,'Paid '+r.date)}${STAMP('PAID')}
    <div style="text-align:center;padding:26px 0 22px;border-bottom:1px solid #EEE;margin-bottom:16px"><div style="${CAP}">Amount paid</div><div style="font-size:40px;font-weight:800;letter-spacing:-.04em;color:#151515">${m2(r.amt)}</div><div style="color:#6B7A80">to ${CO.name} · ${r.method}</div></div>
    ${PARTIES()}${TBL(r.keys.map(k=>{const x=item(k);return [`${x.n} · ${x.inv}`,m2(x.amt)]}),{head:['For','Amount']})}
    ${BOX(`<div style="display:flex;justify-content:space-between"><span>Contract total</span><b>${m2(t.all)}</b></div><div style="display:flex;justify-content:space-between;margin-top:4px"><span>Paid to date</span><b>${m2(t.paid)}</b></div><div style="display:flex;justify-content:space-between;margin-top:4px"><span>Remaining</span><b>${m2(t.left)}</b></div>`)}
    ${Pp('<br>Thank you, '+CU.first+'. This receipt is also kept in your portal for the life of your pool.')}`];
  }
  if(id==='vo'){
    return [`${LH('Variation order','VO-01 · '+JOB,'Raised 20 Oct 2026 · 13:44')}${S.vr==='approved'?STAMP('APPROVED'):''}${PARTIES()}
    ${H('What we found')}${Pp('The old clay drain identified on the survey camera runs directly beneath the deep end. It still carries rainwater from the house, so it must be rerouted before the shell is poured.')}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${DIMG(P.dig2,130)}${DIMG(P.dig,130)}</div>
    ${H('Recommended work')}<ul style="margin:0 0 0 16px;padding:0;color:#3A474D">${['Reroute 9 m of drain around the pool in 110mm plastic pipe','New inspection chamber','Camera test before backfilling','Full photo record added to the portal'].map(t=>`<li style="margin-bottom:4px">${t}</li>`).join('')}</ul>
    ${H('Cost')}${TBL(VAR.lines.map(([a,b])=>[a,m2(b)]),{head:['Item','Amount ex VAT'],tot:[['Subtotal','£1,150.00'],['VAT @ 20%','£230.00'],['Total',m2(1380),1]]})}
    ${BOX('<b>Programme impact:</b> none if approved by 4pm on 20 Oct. <b>Payment:</b> added to your final balance, nothing due now.')}
    ${SIGBLK({img:S.sigVo,n:CU.name,r:S.vr==='approved'?'Approved electronically · 20 Oct 2026':'Customer'},{co:2,n:'Callum',r:'Site manager'})}`];
  }
  if(id==='steel'){
    return [`${LH('Steel & shell inspection','SI-0217','20 Oct 2026 · 15:10')}${STAMP('PASSED')}${PARTIES()}
    ${TBL([['Bar size','12mm high-yield steel'],['Spacing','150mm centres, both ways'],['Cover to steel','75mm, checked with spacers'],['Floor thickness','200mm'],['Wall thickness','200mm'],['Pipework','Pressure tested to 1.5 bar for 2 hours']],{head:['Item','Detail']})}
    ${H('Checklist')}${TBL(['Steel tied at every intersection','Spacers in place throughout','Returns, skimmers & lights set','Pipework pressure test held','Formation clean and dry','Pour plan agreed with pump operator'].map(t=>[t,OK]),{head:['Check','Result']})}
    ${BOX('<b>Approved for pour:</b> 21 Oct 2026, 08:00. Shell to be wet-cured and covered for 7 days.')}
    ${SIGBLK({co:2,n:'Ryan',r:'Build lead'},{co:2,n:'Callum',r:'Site manager'})}`];
  }
  if(id==='eic'){
    return [`${LH('Electrical installation certificate','EIC-0217 · BS 7671','6 Nov 2026')}${STAMP('SATISFACTORY')}${PARTIES()}
    ${TBL([['Work','Pool plant room supply, heat pump, filtration, lighting and cover motor'],['Supply','TN-C-S, single phase, 230V'],['New circuits','Heat pump (32A), plant (20A), lighting (SELV 12V)'],['Special location','Section 702, swimming pools'],['Supplementary bonding','Pool shell, ladder and coping fixings']],{head:['Item','Detail']})}
    ${H('Test results')}${TBL([['Insulation resistance','>200 MΩ'],['Polarity','Correct'],['RCD trip time (30mA)','16 ms'],['Bonding continuity','0.04 Ω'],['SELV separation','Verified']].map(([a,b])=>[a,`${b} · ${OK}`]),{head:['Test','Result']})}
    ${BOX('Notified to building control through the installer\'s competent person scheme. Your compliance certificate will follow by post.')}
    ${SIGBLK({co:2,n:'NICEIC electrician',r:'Designer, installer & tester'},{co:1,n:'Tom',r:'Contract manager'})}`];
  }
  if(id==='war'){
    return [`${LH('Guarantees & warranties','WR-0217 · registered in your name','9 Nov 2026')}${PARTIES()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${[['Concrete shell','25-year structural guarantee','Insurance-backed'],['Mosaic & coping','10-year finish guarantee','Porcelain & sandstone'],['Heat pump','5-year manufacturer warranty','Parts & labour'],['Automatic cover','5-year warranty','Slats, motor & controls'],['Filtration & dosing','3-year warranty','Pump, filter, controller'],['Workmanship','10-year Tidewell guarantee','The whole installation']].map(([a,b,c])=>`<div style="border:1px solid #DFE9EB;border-radius:10px;padding:14px"><div style="font-weight:800;font-size:13px">${a}</div><div style="color:#0F4C5C;font-weight:700;margin-top:4px">${b}</div><div style="color:#74838A;font-size:9.5px;margin-top:2px">${c}</div><div style="margin-top:8px">${OK.replace('Pass','Registered')}</div></div>`).join('')}</div>
    ${H('Making a claim')}${Pp('Just tap Report an issue in your portal. We can see your pool controller remotely, so most issues are diagnosed without a visit. We deal with the manufacturers for you.')}
    ${BOX('All guarantees transfer to the new owner if you sell your home. Keep this page with your council certificate.')}
    ${SIGBLK({co:1,n:'Tom',r:'Founder'},{img:S.sigOff,n:CU.name,r:'Signed off · 9 Nov 2026'})}`];
  }
  if(id==='care'){
    const sec=(h,items)=>`${H(h)}${items.map(t=>`<div style="display:flex;gap:8px;margin-bottom:6px;color:#3A474D"><span style="color:#2CC6CF">●</span><span>${t}</span></div>`).join('')}`;
    return [`${LH('Your pool, explained','Owner\'s guide · '+JOB,'Keep this handy')}${DIMG(P.brick,170)}
    ${sec('Day to day',['Your pool runs itself. The heat pump, filter and dosing are all automatic.','Use the app to set the temperature, open the cover and change the lights.','Close the cover whenever you are not swimming. It holds onto most of the heat.'])}
    ${sec('Keeping costs low',['28 to 29°C is the sweet spot. Every degree warmer costs about 10% more.','Heat the pool in the afternoon when the air is warmest.','Keep skimmer baskets clear so the filter works easily.'])}`,
    `${sec('If something seems off',['Cloudy or green water: tap Report an issue with a photo.','The app shows a fault: we usually see it before you do.','A sudden drop in water level: call us straight away.'])}
    ${sec("Please don't",['Add chemicals yourself unless we ask you to.','Walk on the cover, it is not designed to take weight.','Drain the pool. A concrete pool must always stay full.'])}
    ${BOX(`<b>Need us?</b> ${CO.phone} · WhatsApp ${CO.wa} · ${CO.email}`)}`];
  }
  if(id==='nbr'){
    return [`${LH('','',S.startDate?'Work starts '+S.startDate+' 2026':'October 2026')}<div style="font-size:12px;color:#3A474D;line-height:1.7">
    <p style="margin:0 0 12px">Dear Neighbour,</p><p style="margin:0 0 12px">We wanted to let you know that Tidewell Pools will be building a garden swimming pool at <b>${CU.a1}</b>, starting on <b>${S.startDate||'Mon 5 Oct'}</b> for around five weeks.</p>
    <p style="margin:0 0 12px">The noisiest part is the first three days, while we dig. A compact digger and grab lorries will come and go between 8am and 4:30pm. We use ground mats and road sweepers so the road stays clean.</p>
    <p style="margin:0 0 12px">On one morning a concrete pump lorry will park outside for about four hours. We will put a note through your door the day before.</p>
    <p style="margin:0 0 12px">If anything at all bothers you while we're working, please call our site manager Callum directly on <b>07700 900 731</b>. He'll sort it the same day.</p>
    <p style="margin:0 0 12px">Thank you for your patience.</p><p style="margin:0">Warm regards,</p>${C_SIG}<p style="margin:0"><b>Callum</b><br>Site Manager, Tidewell Pools<br><span style="color:#74838A">on behalf of ${CU.name}, ${CU.a1}</span></p></div>`];
  }
  return [`${LH('Document',JOB,today())}${Pp('Document unavailable.')}`];
}

/* doc viewer */
let DZ=false;
function docMeta(id){return docs().find(x=>x.id===id)||{id,t:{steel:'Steel & shell inspection',care:'Your pool, explained',nbr:'Neighbour courtesy letter'}[id]||'Document',s:''}}
A.doc=id=>{
  const d=docMeta(id);if(d.lock){toast('Not available yet',d.s,'lock','mute');return}
  const pages=docPages(id);DZ=false;
  openLayer(PG(d.t,`<div class="dv" id="dv">${pages.map((p,i)=>`<div class="pgw"><div class="paper" style="font-family:Figtree,sans-serif">${p}<div style="position:absolute;left:48px;right:48px;bottom:22px;display:flex;justify-content:space-between;font-size:8.5px;color:#9AA6AB;border-top:1px solid #EEE;padding-top:8px"><span>${CO.legal} · ${CO.reg} · VAT ${CO.vat}</span><span>Page ${i+1} of ${pages.length}</span></div></div></div>`).join('')}<div class="dvbar">${ic('lock',12)} ${pages.length} page${pages.length>1?'s':''} · PDF · ${pages.length*86+42} KB · stored securely</div></div>`,{acts:`<button onclick="A.dz()" aria-label="Zoom">${ic('zoom',20)}</button><button onclick="A.share('${id}')" aria-label="Share">${ic('share',20)}</button>`,foot:docFoot(id)}),{type:'page'});
  setTimeout(fitDocs,40);setTimeout(fitDocs,600);
};
function docFoot(id){
  const dl=`<button class="btn g md" onclick="A.share('${id}')">${ic('share',17)} Share</button><button class="btn p md" onclick="A.dl('${id}')">${ic('dl',17)} Download PDF</button>`;
  if(id==='quote'&&!S.quoteSigned)return `<div class="btns2"><button class="btn g md" onclick="A.dl('quote')">${ic('dl',17)} Download</button><button class="btn p md" onclick="A.sign('quote')">${ic('pen',17)} Accept & sign</button></div>`;
  if(id==='vo'&&S.vr==='pending')return `<div class="btns2"><button class="btn g md" onclick="A.varAsk()">Ask a question</button><button class="btn p md" onclick="A.sign('vo')">${ic('pen',17)} Approve</button></div>`;
  if(id.startsWith('inv:')){const k=id.slice(4),x=item(k);if(x&&x.st==='due'){const ks=(k==='fin'||k==='vr')?"'fin','vr'":`'${k}'`;return `<div class="btns2"><button class="btn g md" onclick="A.dl('${id}')">${ic('dl',17)} Download</button><button class="btn p md" onclick="A.close();setTimeout(()=>A.pay([${ks}]),300)">Pay ${m2(k==='fin'||k==='vr'?sched().filter(y=>(y.k==='fin'||y.k==='vr')&&y.st==='due').reduce((a,y)=>a+y.amt,0):x.amt)}</button></div>`}}
  return `<div class="btns2">${dl}</div>`;
}
function fitDocs(){const dv=$('#dv');if(!dv)return;const W=dv.parentElement.clientWidth;const s=DZ?1:(W-28)/595;
  dv.querySelectorAll('.pgw').forEach(w=>{const p=w.querySelector('.paper');p.style.transform=`scale(${s})`;w.style.width=595*s+'px';w.style.height=p.offsetHeight*s+'px'});
  dv.parentElement.style.overflowX=DZ?'auto':'hidden';dv.style.width=DZ?(595+28)+'px':''}
A.dz=()=>{DZ=!DZ;fitDocs();toast(DZ?'Actual size':'Fit to screen','',DZ?'zoom':'search','mute')};
A.dl=id=>{
  const pages=docPages(id),d=docMeta(id);
  const html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${d.t} · Tidewell Pools</title><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>@page{size:A4;margin:0}body{margin:0;font-family:Figtree,sans-serif;background:#E3E9EB;-webkit-print-color-adjust:exact;print-color-adjust:exact}.p{width:210mm;min-height:297mm;background:#fff;margin:16px auto;padding:48px 48px 70px;box-sizing:border-box;font-size:11px;line-height:1.55;color:#22272B;position:relative;page-break-after:always;box-shadow:0 4px 20px rgba(0,0,0,.1)}@media print{body{background:#fff}.p{margin:0;box-shadow:none}}</style></head><body>${pages.map(p=>`<div class="p">${p}</div>`).join('')}<script>window.onload=()=>setTimeout(()=>print(),700)<\/script></body></html>`;
  let w=null;try{w=window.open('','_blank')}catch(e){}
  if(w&&w.document){w.document.open();w.document.write(html);w.document.close();toast('PDF ready','Choose "Save as PDF" to keep a copy','dl','blue')}
  else{const b=new Blob([html],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=d.t.replace(/[^a-z0-9]+/gi,'-')+'.html';document.body.appendChild(a);a.click();a.remove();toast('Downloaded',d.t,'dl','ok')}
};

/* ================= LOGIN ================= */
function showLogin(){
  closeAll();const L=$('#login');L.style.display='flex';L.classList.remove('out');
  L.innerHTML=`<div class="lh">${ph(P.tudor,'','style="position:absolute;inset:0"')}</div><div class="lb2" id="lgb">${lg1()}</div>`;
}
function lg1(){return `<div style="display:flex;align-items:center;gap:12px">${mark(56,16)}${word(34)}</div><h1>Your pool, from first dig to first swim.</h1><p>Your build, your payments, your paperwork and your pool controls, all in one place.</p>
  <div class="field mt20"><label>Email</label><input id="lem" type="email" value="${CU.email}"></div>
  <button class="btn p mt12" onclick="A.otp()">Send my login code</button>
  <button class="btn g mt8" onclick="A.face()">${ic('face',20)} Sign in with Face ID</button>
  <div class="small muted" style="text-align:center;margin-top:auto;padding-top:16px">${CO.tag} No passwords to remember.</div>`}
A.otp=()=>{const g=$('#lgb');g.innerHTML=`<button onclick="$('#lgb').innerHTML=lg1()" style="color:var(--acc);font-weight:600;display:flex;align-items:center;margin-top:8px">${ic('cl',22,2.2)}Back</button><h1>Check your inbox</h1><p>We've sent a 6-digit code to o•••••.bennett@gmail.com</p>
  <div class="otp mt20" id="otp">${'<span></span>'.repeat(6)}</div><div style="display:flex;justify-content:center;margin-top:16px"><span class="pill mute">${ic('sparkle',12)} Filling from Mail…</span></div>
  <div class="small muted" style="text-align:center;margin-top:auto;padding-top:16px">Didn't get it? Resend in 0:28</div>`;
  const code='217604',sp=g.querySelectorAll('.otp span');code.split('').forEach((c,i)=>setTimeout(()=>{sp[i].textContent=c;sp[i].classList.add('f')},700+i*130));setTimeout(enter,700+6*130+450)};
A.face=()=>{const g=$('#lgb');g.innerHTML=`<div style="margin:auto;text-align:center"><div class="faceid scan" id="fid">${ic('face',64,1.3)}</div><div style="font-weight:600;margin-top:14px">Face ID</div></div>`;setTimeout(()=>{$('#fid').style.color='var(--ok)';$('#fid').innerHTML=ic('check',64,1.5)},950);setTimeout(enter,1500)};
function enter(){const L=$('#login');L.classList.add('out');setTimeout(()=>{L.style.display='none'},520);S.tab='home';render(true);$('#view').scrollTop=0;
  setTimeout(()=>{const a=actions().filter(x=>x.b);toast(`Welcome back, ${CU.first}`,S.stage==='complete'?`Your pool is at ${PL.temp.toFixed(1)}°C right now 🏊`:a.length?`${a.length} thing${a.length>1?'s':''} need${a.length>1?'':'s'} your attention`:"You're all caught up",S.stage==='complete'?'swim':'home',S.stage==='complete'?'mint':a.length?'acc':'ok')},700)}

/* ================= DEMO PANEL ================= */
function renderDemo(){const d=$('#demoStages');if(!d)return;
  d.innerHTML=[['quote','Design sent','New customer, deciding'],['progress','Build in progress','Approvals, payments, live updates'],['complete','Pool ready','Pool control, sign-off, guarantees']].map(([k,t,s],i)=>`<button class="${S.stage===k?'on':''}" onclick="A.setStage('${k}')"><b>${i+1}</b><span>${t}<small>${s}</small></span></button>`).join('');
  $('#demoTry').innerHTML=({quote:['Watch "Your garden, explained"','Pick a pool and add extras','Drag the running cost slider','Sign the design with your finger','Pay the deposit, then pick a dig day'],progress:['Approve the drain reroute','Pay the shell payment','Track the steel delivery live','Open any document and download it','Message the crew'],complete:['Open pool control, turn the heat up','Open the cover, change the lights','Sign off and register guarantees','Book your first service visit','Plan a pool house']})[S.stage].map(x=>`<li>${x}</li>`).join('')}

/* ================= BOOT ================= */
function fit(){
  const nat=innerWidth<=520;document.body.classList.toggle('native',nat);const pb=$('#phonebox'),p=$('#phone');
  if(nat){pb.style.width=pb.style.height='';p.style.transform='';renderTabs();return}
  const showDemo=innerWidth>=940&&innerHeight>=560;$('#demo').style.display=showDemo?'':'none';
  const s=Math.min(1,(innerHeight-40)/868,(innerWidth-(showDemo?400:40))/414);p.style.transform=`scale(${s})`;pb.style.width=414*s+'px';pb.style.height=868*s+'px';
}
function clock(){const d=new Date();$('#clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
S=fresh('complete');render();fit();clock();setInterval(clock,15000);showLogin();
setInterval(()=>{if(S.stage==='complete'&&!LS.some(l=>l.el.querySelector('#enb')))plUpdate()},3000);
addEventListener('resize',()=>{fit();if($('#dv'))fitDocs()});

</script>
