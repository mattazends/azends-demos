<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F5F8F9"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Pool"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 180 180%27%3E%3Crect width=%27180%27 height=%27180%27 rx=%2740%27 fill=%27%230F4C5C%27/%3E%3Cpath d=%27M30 100c20-18 40-18 60 0s40 18 60 0%27 stroke=%27%235CE1E6%27 stroke-width=%2714%27 fill=%27none%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tidewell Pools · My Pool</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EDEF;--app:#F5F8F9;--card:#fff;--ink:#151515;--ink2:#3A474D;--mute:#74838A;--faint:#B3B9B5;
  --line:#EDF1F2;--line2:#E0E7E9;--fill:#EEF3F4;
  --brand:#0F4C5C;--brand2:#0A3742;--acc:#0E7C8C;--acc2:#5CE1E6;--accs:#DDF6F7;--mint:#5CE1E6;--mintd:#2CC6CF;
  --ok:#14955A;--oks:#E0F5EA;--warn:#C27E06;--warns:#FBF0D8;--bad:#D2463E;--bads:#FBE6E4;--blue:#2E6BE0;--blues:#E8EFFC;
  --sat:54px;--r:22px;
  --sh:0 1px 2px rgba(21,21,21,.04),0 8px 28px -6px rgba(21,21,21,.07);
  --ease:cubic-bezier(.2,.9,.25,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Figtree',-apple-system,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px;letter-spacing:-.011em;line-height:1.4}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(55% 55% at 72% 18%,#D8F3F5 0,transparent 62%),radial-gradient(50% 50% at 18% 88%,#E3E9F0 0,transparent 60%)}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;font-size:inherit;text-align:inherit}
input,textarea,select{font-family:inherit;letter-spacing:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{flex-shrink:0;display:block}

/* ---------- stage + phone ---------- */
.stagewrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:72px;z-index:1}
.phonebox{position:relative;flex-shrink:0}
.phone{position:absolute;top:0;left:0;width:414px;height:868px;border-radius:66px;padding:12px;background:linear-gradient(150deg,#34373b,#0c0d0e 38%,#1d1e20);box-shadow:inset 0 0 0 1.5px #44474c,inset 0 0 0 4px #0b0b0c,0 60px 110px -30px rgba(40,30,20,.38),0 30px 60px -30px rgba(0,0,0,.35);transform-origin:0 0}
.phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#26282b;left:-3px}
.phone::before{top:190px;height:64px}.phone::after{top:270px;height:64px}
.screen{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--app);isolation:isolate}
.sbfade{position:absolute;top:0;left:0;right:0;height:var(--sat);z-index:55;pointer-events:none;background:linear-gradient(var(--app) 55%,rgba(245,244,241,0));transition:opacity .2s}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:900;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 46px;font-weight:600;font-size:16px;z-index:800;pointer-events:none;color:var(--ink);transition:color .3s}
.statusbar .sb-r{display:flex;gap:6px;align-items:center}
.screen.darkbar .statusbar{color:#fff}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#121416;z-index:900;pointer-events:none;transition:background .3s}
.screen.darkbar .homebar{background:#fff}

body.native .stagewrap{display:block}
body.native .phonebox{width:100%!important;height:100%!important}
body.native .phone{position:fixed;inset:0;width:100%;height:100%;border-radius:0;padding:0;background:var(--app);box-shadow:none;transform:none!important}
body.native .phone::before,body.native .phone::after{display:none}
body.native .screen{width:100%;height:100%;border-radius:0}
body.native .island,body.native .statusbar,body.native .homebar{display:none}
body.native{--sat:max(env(safe-area-inset-top),16px)}
body.native .demo{display:none}

/* ---------- demo panel (desktop only) ---------- */
.demo{width:268px;background:rgba(255,255,255,.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8);border-radius:26px;padding:24px 22px;box-shadow:0 20px 50px -25px rgba(30,25,20,.25)}
.demo .eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.demo h2{font-size:21px;font-weight:600;letter-spacing:-.025em;margin:8px 0 6px;line-height:1.2}
.demo p{font-size:13px;color:var(--mute);line-height:1.5}
.demo .st{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.demo .st button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line2);font-size:14px;font-weight:500;transition:.2s}
.demo .st button b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--fill);color:var(--ink2);font-weight:600}
.demo .st button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.demo .st button.on b{background:rgba(255,255,255,.18);color:#fff}
.demo .st button span{display:flex;flex-direction:column;line-height:1.25}
.demo .st button small{font-size:11.5px;opacity:.6;font-weight:400}
.demo .try{margin-top:20px;padding-top:18px;border-top:1px solid var(--line2)}
.demo .try h4{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:8px}
.demo .try li{list-style:none;font-size:12.5px;color:var(--mute);padding:4px 0 4px 16px;position:relative}
.demo .try li::before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--acc2)}
.demo .reset{margin-top:16px;font-size:12.5px;color:var(--ink2);font-weight:500;display:flex;align-items:center;gap:6px}

/* ---------- app shell ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-bottom:120px;scrollbar-width:none;overscroll-behavior:contain}
.view::-webkit-scrollbar,.sheet-b::-webkit-scrollbar,.page-b::-webkit-scrollbar{display:none}
.view.fade{animation:vin .35s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{position:absolute;bottom:0;left:0;right:0;display:flex;padding:8px 4px 28px;background:rgba(248,247,244,.84);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border-top:.5px solid rgba(0,0,0,.09);z-index:60}
body.native .tabbar{padding-bottom:max(env(safe-area-inset-bottom),12px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:#A2A5A8;position:relative;padding-top:2px;transition:color .2s}
.tab.on{color:var(--brand)}
.tab .bdg{position:absolute;top:-3px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;border:2px solid #F8F7F4}

.topbar{padding:calc(var(--sat) + 6px) 20px 4px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.02em}
.logo .mk{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.logo small{display:block;font-size:11px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:-1px}
.tb-r{display:flex;gap:8px}
.ibtn{width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;position:relative;color:var(--ink)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid #fff}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(135deg,#2B8A9C,#0A3742);flex-shrink:0;position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.av.me{background:linear-gradient(135deg,#7B8CE0,#3F4FA8)}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.xs{width:24px;height:24px;font-size:10px}
.av.lg{width:52px;height:52px;font-size:17px}
.av.slate{background:linear-gradient(135deg,#2B8A9C,#0A3742)}
.av.sage{background:linear-gradient(135deg,#7F9A86,#4D6A56)}
.av.sand{background:linear-gradient(135deg,#C2A57E,#8D7049)}
.greet{padding:14px 20px 0}
.greet p{color:var(--mute);font-size:14px}
.greet h1{font-size:30px;font-weight:600;letter-spacing:-.035em;line-height:1.12;margin-top:2px}
.ttl{padding:calc(var(--sat) + 10px) 20px 6px}
.ttl p{color:var(--mute);font-size:13.5px}
.ttl h1{font-size:32px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin-top:2px}

.sec{display:flex;justify-content:space-between;align-items:baseline;padding:0 20px;margin:26px 0 10px}
.sec h3{font-size:19px;font-weight:600;letter-spacing:-.025em}
.sec a,.sec button{font-size:14px;color:var(--acc);font-weight:500}
.sec .cnt{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--bad);color:#fff;font-size:12px;font-weight:600;margin-left:6px;padding:0 6px;vertical-align:3px}
.px{padding:0 16px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.cardp{padding:18px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.muted{color:var(--mute)}
.small{font-size:13px}
.lbl{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}

.list{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;position:relative;width:100%;text-align:left}
.list .row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
.list.flat .row+.row::before{left:16px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:500;font-size:15px;line-height:1.3}
.row .s{font-size:13px;color:var(--mute);margin-top:2px;line-height:1.35}
.row .r{text-align:right;flex-shrink:0;display:flex;align-items:center;gap:8px}
.row .chev{color:#C4C6C8}
button.row:active{background:#FAF9F7}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.ic.sm{width:34px;height:34px;border-radius:10px}
.t-ok{background:var(--oks);color:var(--ok)}.t-warn{background:var(--warns);color:var(--warn)}.t-bad{background:var(--bads);color:var(--bad)}.t-acc{background:var(--accs);color:var(--acc)}.t-blue{background:var(--blues);color:var(--blue)}.t-mute{background:var(--fill);color:var(--ink2)}.t-brand{background:var(--brand);color:#fff}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;letter-spacing:0}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.warn{background:var(--warns);color:var(--warn)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.mute{background:var(--fill);color:var(--ink2)}.pill.acc{background:var(--accs);color:var(--acc)}.pill.blue{background:var(--blues);color:var(--blue)}.pill.glass{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.live{width:7px;height:7px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

.btn{height:52px;border-radius:15px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s,opacity .2s,background .2s;letter-spacing:-.015em}
.btn:active{transform:scale(.975)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.p{background:var(--mint);color:#06262E}.btn.dk{background:var(--brand);color:#fff}.btn.a{background:var(--acc);color:#fff}.btn.g{background:var(--fill);color:var(--ink)}.btn.w{background:#fff;color:var(--ink);box-shadow:var(--sh)}.btn.ok{background:var(--ok);color:#fff}.btn.blk{background:#000;color:#fff}
.btn.sm{height:38px;border-radius:11px;font-size:14px;width:auto;padding:0 14px}
.btn.md{height:44px;border-radius:13px;font-size:15px}
.btn .spin{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(11,31,21,.25);border-top-color:#06262E;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* photos */
.ph{background:linear-gradient(135deg,#2A6E7E,#0A3742);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s}

/* ---------- home ---------- */
.hero{margin:16px 16px 0;height:262px;border-radius:28px;color:#fff;position:relative;box-shadow:0 18px 40px -18px rgba(10,55,66,.55);background:var(--brand)}
.hero .ph{position:absolute;inset:0;border-radius:28px}
.hero::after{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,rgba(6,34,42,.35) 0,rgba(6,34,42,0) 30%,rgba(12,64,78,.35) 50%,rgba(8,48,58,.94) 100%);pointer-events:none}
.hero .in{position:absolute;inset:0;padding:18px;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start}
.hero h2{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.hero .sub{font-size:13.5px;opacity:.78;margin-top:3px}
.ring{width:62px;height:62px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring svg circle+circle{stroke:var(--mint)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600}
.segs{display:flex;gap:3px;margin-top:14px}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.segs i.d{background:var(--mint)}
.segs i.c::after{content:"";position:absolute;inset:0;width:55%;background:var(--mint);border-radius:2px;animation:grow 2.4s ease-in-out infinite alternate}
@keyframes grow{from{width:30%}to{width:65%}}
.hero .meta{display:flex;justify-content:space-between;font-size:12.5px;opacity:.85;margin-top:9px}
.hero .cta{margin-top:14px;display:flex;gap:8px}
.hero .cta .btn{height:44px;font-size:15px;border-radius:13px}

.act{display:flex;gap:13px;align-items:center;padding:15px 16px;background:#fff;border-radius:20px;box-shadow:var(--sh);width:100%;text-align:left;position:relative;overflow:hidden;transition:transform .15s}
.act:active{transform:scale(.985)}
.act+.act{margin-top:10px}
.act .tx{flex:1;min-width:0}
.act .t{font-weight:600;font-size:15px;letter-spacing:-.015em}
.act .s{font-size:13px;color:var(--mute);margin-top:2px}
.act .go{height:34px;padding:0 13px;border-radius:10px;font-size:13.5px;font-weight:600;display:grid;place-items:center;background:var(--mint);color:#06262E;flex-shrink:0}
.act.urgent::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--bad)}
.caught{display:flex;gap:12px;align-items:center;padding:16px;background:#fff;border-radius:20px;box-shadow:var(--sh)}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.quick button{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink2)}
.quick .ic{width:38px;height:38px}

.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px}
.wx div{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;border-radius:14px;font-size:12px;color:var(--ink2)}
.wx div b{font-weight:600;font-size:13px;color:var(--ink)}
.wx div.today{background:var(--fill)}
.wx div.rain{background:var(--blues)}
.wx small{font-size:11px;color:var(--mute)}
.wx div.rain small{color:var(--blue);font-weight:600}

.upd{padding:16px}
.upd .hd{display:flex;gap:10px;align-items:center}
.upd .hd .t{font-weight:600;font-size:14.5px}
.upd .hd .s{font-size:12.5px;color:var(--mute)}
.upd p{margin-top:10px;font-size:14.5px;color:var(--ink2);line-height:1.5}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px}
.thumbs .ph{height:120px;border-radius:14px}
.thumbs.three{grid-template-columns:repeat(3,1fr)}
.thumbs.three .ph{height:92px}

.paysum{padding:18px}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .8s var(--ease)}
.bar i.p{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,#E3A73C 4px,#E3A73C 8px)}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}

.pm{display:flex;gap:12px;align-items:center;padding:16px}
.pm .tx{flex:1}
.pm .t{font-weight:600}
.pm .s{font-size:13px;color:var(--mute)}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}

.stories{display:flex;gap:14px;overflow-x:auto;padding:2px 20px 4px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);width:68px;flex-shrink:0}
.story .rg{width:68px;height:68px;border-radius:50%;padding:2.5px;background:conic-gradient(var(--brand),var(--mint),var(--brand))}
.story .rg .ph{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--app)}
.story.seen .rg{background:var(--line2)}

.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.trust div{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 10px;text-align:center}
.trust b{display:block;font-size:20px;font-weight:600;letter-spacing:-.03em}
.trust span{font-size:11.5px;color:var(--mute);line-height:1.3;display:block;margin-top:2px}

.promo{border-radius:24px;padding:20px;color:#fff;position:relative;overflow:hidden;background:var(--brand)}
.promo.acc{background:#151515}.promo.mint{background:var(--mint);color:#06262E}.promo.mint p{opacity:.7}
.promo h4{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.promo p{font-size:13.5px;opacity:.78;margin-top:6px;line-height:1.45}
.promo .btn{margin-top:14px;height:42px;font-size:14.5px;border-radius:12px;width:auto;padding:0 16px;display:inline-flex}
.promo .deco{position:absolute;right:-30px;top:-30px;opacity:.12}

.guar{padding:18px;display:flex;gap:14px;align-items:center}
.guar .seal{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#37B5C4,#0A3742);display:grid;place-items:center;color:#fff;flex-shrink:0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}

.check{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;width:100%;text-align:left;position:relative}
.list .check+.check::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--line)}
.cb{width:24px;height:24px;border-radius:50%;border:1.8px solid #CFCCC6;display:grid;place-items:center;flex-shrink:0;color:transparent;transition:.2s;margin-top:1px}
.check.on .cb{background:var(--ok);border-color:var(--ok);color:#fff}
.check .t{font-size:14.5px;font-weight:500}
.check.on .t{color:var(--mute);text-decoration:line-through}
.check .s{font-size:12.5px;color:var(--mute);margin-top:1px}

/* ---------- project ---------- */
.prog{padding:20px}
.prog .big{font-size:44px;font-weight:600;letter-spacing:-.05em;line-height:1}
.prog .row2{display:flex;justify-content:space-between;align-items:flex-end}
.prog .segs i{background:var(--fill);height:6px;border-radius:3px}
.prog .segs i.d{background:var(--ok)}
.prog .segs i.c{background:var(--fill)}
.prog .segs i.c::after{background:var(--ok)}
.tl{padding:6px 0}
.tli{display:flex;gap:14px;padding:0 18px;position:relative;width:100%;text-align:left}
.tli .rail{display:flex;flex-direction:column;align-items:center;width:26px;flex-shrink:0}
.tli .nd{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:#fff;color:transparent;z-index:1;margin-top:12px}
.tli.d .nd{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.c .nd{border-color:var(--brand);background:#fff;box-shadow:0 0 0 5px var(--accs)}
.tli.c .nd::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--brand)}
.tli .ln{flex:1;width:2px;background:var(--line2);min-height:14px}
.tli.d .ln{background:var(--ok)}
.tli:last-child .ln{display:none}
.tli .bd{flex:1;padding:14px 0 14px;border-bottom:1px solid var(--line);min-width:0}
.tli:last-child .bd{border-bottom:0}
.tli .t{font-weight:500;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.tli.u .t{color:var(--mute)}
.tli .dt{font-size:12.5px;color:var(--mute);margin-top:2px}
.tli .more{font-size:13.5px;color:var(--ink2);margin-top:8px;line-height:1.5;display:none}
.tli.open .more{display:block}
.tli .more .thumbs{margin-top:10px}

.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 16px}
.gal .ph{aspect-ratio:1;border-radius:6px}
.gal .ph:first-child{border-top-left-radius:18px}.gal .ph:nth-child(3){border-top-right-radius:18px}
.gal .ph:nth-last-child(3){border-bottom-left-radius:18px}.gal .ph:last-child{border-bottom-right-radius:18px}
.gal .ph span{position:absolute;left:6px;bottom:6px;font-size:10.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;backdrop-filter:blur(6px)}

.ba{position:relative;height:250px;border-radius:22px;overflow:hidden;margin:0 16px;touch-action:none;cursor:ew-resize;user-select:none}
.ba .ph{position:absolute;inset:0}
.ba .bef{clip-path:inset(0 50% 0 0)}
.ba .bef img{filter:grayscale(.7) contrast(.9) brightness(.82) sepia(.15)}
.ba .hd{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-1px)}
.ba .hd b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);color:var(--ink)}
.ba .tg{position:absolute;top:12px;font-size:11.5px;font-weight:600;color:#fff;background:rgba(0,0,0,.42);padding:4px 9px;border-radius:8px;backdrop-filter:blur(8px)}

.diary{padding:0 16px}
.dy{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.dy:last-child{border-bottom:0}
.dy .tx{flex:1;min-width:0}
.dy .hd{display:flex;justify-content:space-between;font-size:13px}
.dy .hd b{font-weight:600}
.dy .hd span{color:var(--mute)}
.dy p{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5}
.dy .thumbs .ph{height:96px}

/* ---------- payments ---------- */
.ptot{margin:14px 16px 0;border-radius:28px;padding:22px;color:#fff;background:radial-gradient(120% 120% at 100% 0,#1A7487 0,#0A3742 60%);position:relative;overflow:hidden;box-shadow:0 18px 40px -18px rgba(28,41,48,.55)}
.ptot .lb{font-size:13px;opacity:.65}
.ptot .amt{font-size:40px;font-weight:600;letter-spacing:-.045em;margin-top:2px;line-height:1.05}
.ptot .amt small{font-size:20px;opacity:.6;font-weight:500}
.ptot .bar{background:rgba(255,255,255,.13);height:7px}
.ptot .bar i{background:var(--mint)}
.ptot .bar i.p{background:repeating-linear-gradient(45deg,#E9B44C,#E9B44C 4px,#C99331 4px,#C99331 8px)}
.ptot .g3{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:16px;gap:8px}
.ptot .g3 span{font-size:11.5px;opacity:.6;display:block}
.ptot .g3 b{font-size:15px;font-weight:600}
.next{padding:18px}
.next .t1{display:flex;justify-content:space-between;align-items:center}
.next .amt{font-size:30px;font-weight:600;letter-spacing:-.04em;margin:6px 0 2px}
.sch .row .amtc{font-weight:600;font-size:15px}
.tog{width:51px;height:31px;border-radius:16px;background:#E2E0DB;position:relative;flex-shrink:0;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .25s var(--ease)}
.tog.on{background:var(--ok)}
.tog.on::after{transform:translateX(20px)}
.cardvis{height:44px;width:64px;border-radius:8px;background:linear-gradient(135deg,#1F3B73,#2E6BE0);color:#fff;font-size:12px;font-weight:700;font-style:italic;display:flex;align-items:flex-end;justify-content:flex-end;padding:6px 8px;flex-shrink:0;letter-spacing:.02em}
.cardvis.mc{background:linear-gradient(135deg,#2B2B2B,#555)}

/* ---------- docs ---------- */
.search{margin:6px 16px 0;height:42px;border-radius:13px;background:#ECEAE5;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--mute)}
.search input{border:0;background:none;outline:none;flex:1;font-size:15.5px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:17px;background:#fff;box-shadow:var(--sh);font-size:13.5px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:6px;color:var(--ink2)}
.chip.on{background:var(--brand);color:#fff}
.chip small{opacity:.55;font-size:12px}
.dicon{width:40px;height:48px;border-radius:8px;background:#fff;border:1px solid var(--line2);position:relative;flex-shrink:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:8.5px;font-weight:700;letter-spacing:.04em;overflow:hidden}
.dicon::before{content:"";position:absolute;top:0;right:0;width:12px;height:12px;background:linear-gradient(225deg,var(--app) 50%,var(--line2) 50%)}
.dicon i{position:absolute;left:7px;right:9px;height:2px;border-radius:1px;background:#E6E3DE}
.dicon i:nth-child(1){top:11px;right:16px}.dicon i:nth-child(2){top:17px}.dicon i:nth-child(3){top:23px;right:14px}
.dicon.red{color:var(--bad)}.dicon.blue{color:var(--blue)}.dicon.green{color:var(--ok)}.dicon.acc{color:var(--acc)}
.dicon .lk{position:absolute;inset:0;background:rgba(245,244,241,.75);display:grid;place-items:center;color:var(--mute)}

/* ---------- messages ---------- */
.chat{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--app)}
.chat-h{padding:calc(var(--sat) + 4px) 16px 12px;display:flex;align-items:center;gap:12px;background:rgba(248,247,244,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--line2);z-index:2}
.chat-h .tx{flex:1}
.chat-h .t{font-weight:600;font-size:16px}
.chat-h .s{font-size:12.5px;color:var(--ok);display:flex;align-items:center;gap:5px}
.chat-b{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:none}
.chat-b::-webkit-scrollbar{display:none}
.dayd{text-align:center;font-size:11.5px;color:var(--mute);font-weight:500;margin:12px 0 6px}
.msg{max-width:78%;padding:10px 13px;border-radius:19px;font-size:15px;line-height:1.38;position:relative;animation:pop .3s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.msg.them{background:#fff;align-self:flex-start;border-bottom-left-radius:6px;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.msg.me{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.msg.sys{align-self:center;background:var(--oks);color:var(--ok);font-size:12.5px;font-weight:500;border-radius:12px;padding:7px 12px;max-width:90%;text-align:center}
.msg .who{font-size:11.5px;font-weight:600;color:var(--acc);margin-bottom:2px}
.msg .ph{width:220px;height:150px;border-radius:14px;margin:2px -5px 4px}
.msg .doc{display:flex;gap:10px;align-items:center;background:var(--fill);border-radius:12px;padding:8px 10px;margin:4px -4px 2px;color:var(--ink)}
.msg.me .doc{background:rgba(255,255,255,.12);color:#fff}
.mt{font-size:10.5px;opacity:.5;margin-top:3px;text-align:right}
.typing{align-self:flex-start;background:#fff;border-radius:19px;border-bottom-left-radius:6px;padding:13px 15px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:#B8BBBE;animation:ty 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.qr::-webkit-scrollbar{display:none}
.qr button{white-space:nowrap;height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line2);background:#fff;font-size:13.5px;color:var(--ink2)}
.comp{display:flex;align-items:center;gap:8px;padding:8px 12px 34px;background:rgba(248,247,244,.94);border-top:.5px solid var(--line2)}
body.native .comp{padding-bottom:max(env(safe-area-inset-bottom),12px)}
.comp input[type=text]{flex:1;height:40px;border-radius:20px;border:1px solid var(--line2);background:#fff;padding:0 16px;font-size:15.5px;outline:none}
.comp .sb{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center}
.comp .ab{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}

/* ---------- layers ---------- */
.layer{position:absolute;inset:0;z-index:300}
.layer>.bd{position:absolute;inset:0;background:rgba(10,12,14,.4);opacity:0;transition:opacity .35s}
.layer.in>.bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:calc(100% - var(--sat) - 8px);background:var(--app);border-radius:30px 30px 0 0;transform:translateY(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.12)}
.sheet.tall{height:calc(100% - var(--sat) - 8px)}
.layer.in .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#D2CFC9;margin:8px auto 0;flex-shrink:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;flex-shrink:0}
.sheet-h h3{font-size:18px;font-weight:600;letter-spacing:-.025em}
.xb{width:32px;height:32px;border-radius:50%;background:#E8E6E1;display:grid;place-items:center;color:var(--ink2)}
.sheet-b{overflow-y:auto;padding:4px 16px 40px;flex:1;scrollbar-width:none}
.sheet-f{padding:12px 16px 34px;border-top:.5px solid var(--line2);background:var(--app);flex-shrink:0}
body.native .sheet-f{padding-bottom:max(env(safe-area-inset-bottom),14px)}
.page{position:absolute;inset:0;background:var(--app);transform:translateX(100%);transition:transform .45s var(--ease);display:flex;flex-direction:column}
.layer.in .page{transform:none}
.layer.under .page{transform:translateX(-22%)}
.page.dark{background:#08090A;color:#fff}
.page-h{padding:calc(var(--sat) + 2px) 8px 8px;display:flex;align-items:center;gap:4px;background:rgba(245,244,241,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--line2);flex-shrink:0;z-index:3}
.page-h .bk{display:flex;align-items:center;color:var(--acc);font-size:16px;font-weight:500;padding:6px 6px;min-width:70px}
.page-h h3{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-h .acts{display:flex;justify-content:flex-end;min-width:70px;gap:2px}
.page-h .acts button{width:36px;height:36px;display:grid;place-items:center;color:var(--acc)}
.page-b{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.page-f{padding:12px 16px 34px;background:rgba(245,244,241,.94);backdrop-filter:blur(18px);border-top:.5px solid var(--line2);flex-shrink:0}
body.native .page-f{padding-bottom:max(env(safe-area-inset-bottom),14px)}

/* toast (grows out of the island) */
.toast{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:950;color:#fff;display:flex;align-items:center;gap:11px;padding:0 14px;overflow:hidden;opacity:0;transition:width .5s cubic-bezier(.3,1.25,.5,1),height .5s cubic-bezier(.3,1.25,.5,1),border-radius .5s,opacity .2s;pointer-events:none}
body.native .toast{top:calc(env(safe-area-inset-top) + 6px)}
.toast.show{opacity:1;width:350px;height:66px;border-radius:30px;pointer-events:auto}
.toast .tc{display:flex;align-items:center;gap:11px;width:100%;opacity:0;transition:opacity .25s .15s}
.toast.show .tc{opacity:1}
.toast .ti svg{color:#fff}
.toast .ti{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.toast .tt{font-size:14px;font-weight:600;line-height:1.25}
.toast .ts{font-size:12.5px;opacity:.6;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}

/* forms */
.field{background:#fff;border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.field label{display:block;padding:10px 14px 0;font-size:11.5px;color:var(--mute);font-weight:500}
.field input,.field textarea,.field select{width:100%;border:0;outline:none;padding:3px 14px 11px;font-size:16px;background:none;resize:none}
.field+.field{margin-top:10px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.f2 .field{margin-top:0}
.seg{display:flex;background:#E9E7E2;border-radius:12px;padding:3px}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08);color:var(--ink)}
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;background:#fff;border-radius:16px;box-shadow:var(--sh);width:100%;text-align:left;border:1.5px solid transparent;transition:border-color .2s}
.opt+.opt{margin-top:8px}
.opt.on{border-color:var(--brand)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:1.8px solid #CBC8C2;flex-shrink:0;display:grid;place-items:center}
.opt.on .rd{border-color:var(--brand)}
.opt.on .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--brand)}
.opt .tx{flex:1}
.opt .t{font-weight:500}
.opt .s{font-size:12.5px;color:var(--mute)}

.sig{position:relative;background:#fff;border-radius:18px;box-shadow:var(--sh);height:170px;overflow:hidden}
.sig canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.sig .line{position:absolute;left:22px;right:22px;bottom:42px;border-top:1.5px dashed #D6D3CD;pointer-events:none}
.sig .x{position:absolute;left:22px;bottom:48px;color:#C9C6C0;font-size:18px;pointer-events:none}
.sig .hint{position:absolute;inset:0;display:grid;place-items:center;color:#BDBAB4;font-size:14px;pointer-events:none;transition:opacity .2s}
.sig .clr{position:absolute;right:10px;top:10px;font-size:13px;color:var(--acc);font-weight:500;padding:4px 8px}
.sig .nm{position:absolute;left:22px;bottom:16px;font-size:12px;color:var(--mute);pointer-events:none}

.summ{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:6px 16px}
.summ .l{display:flex;justify-content:space-between;padding:9px 0;font-size:14.5px}
.summ .l+.l{border-top:1px solid var(--line)}
.summ .l span{color:var(--mute)}
.summ .l.tot{font-weight:600;font-size:16px}
.summ .l.tot span{color:var(--ink)}

.succ{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 10px 10px}
.succ .ck{width:86px;height:86px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;animation:ckin .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes ckin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.succ .ck path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.succ h2{font-size:26px;font-weight:600;letter-spacing:-.035em;margin-top:20px}
.succ p{color:var(--mute);margin-top:6px;font-size:14.5px;line-height:1.5;max-width:290px}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.conf i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(700px) rotate(720deg);opacity:0}}

/* quote */
.qopt{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:18px;border:2px solid transparent;width:100%;text-align:left;transition:border-color .2s,transform .15s;position:relative}
.qopt+.qopt{margin-top:10px}
.qopt.on{border-color:var(--brand)}
.qopt .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.qopt h4{font-size:17px;font-weight:600;letter-spacing:-.02em}
.qopt .pr{font-size:22px;font-weight:600;letter-spacing:-.035em;white-space:nowrap}
.qopt .pr small{display:block;font-size:11.5px;color:var(--mute);font-weight:400;letter-spacing:0;text-align:right}
.qopt p{font-size:13.5px;color:var(--mute);margin-top:4px;line-height:1.45}
.qopt ul{list-style:none;margin-top:12px;display:grid;gap:6px}
.qopt li{font-size:13.5px;display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}
.qopt li svg{color:var(--ok);margin-top:2px}
.qopt .badge{position:absolute;top:-10px;left:18px}
.addon{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;text-align:left;position:relative}
.list .addon+.addon::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.addon .tx{flex:1}
.addon .t{font-size:14.5px;font-weight:500}
.addon .s{font-size:12.5px;color:var(--mute)}
.addon .p{font-size:14px;font-weight:600;margin-right:4px}
.qbar{display:flex;align-items:center;gap:14px}
.qbar .tx{flex:1}
.qbar .tx span{font-size:12px;color:var(--mute);display:block}
.qbar .tx b{font-size:22px;font-weight:600;letter-spacing:-.035em}

/* calendar */
.cal{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:16px}
.cal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600;font-size:16px}
.cal .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dn{font-size:11px;color:var(--mute);font-weight:600;padding:4px 0}
.cal .d{height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;color:#C6C8CA;position:relative}
.cal .d.av{color:var(--ink);font-weight:500;background:var(--fill);cursor:pointer}
.cal .d.av::after{content:"";position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--ok)}
.cal .d.sel{background:var(--brand);color:#fff}
.cal .d.sel::after{background:#fff}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots button{height:44px;border-radius:12px;background:#fff;box-shadow:var(--sh);font-weight:500;font-size:14.5px;border:1.5px solid transparent}

const quoteTotal=()=>OPTS[S.quoteOpt].price+ADDONS.reduce((a,x)=>a+(S.addons[x.k]?x.p:0),0);
const contractTotal=()=>S.stage==='quote'?quoteTotal():84900;
const pd=k=>{const r=S.receipts.find(r=>r.keys.includes(k));return r?'Paid '+r.date.replace(' 2026',''):'Paid'};
function sched(){
  const T=contractTotal(),d=r2(T*.2),s2=r2(T*.5),f=r2(T-d-s2),p=S.pay;
  const w={
    dep:{due:'Due on acceptance',processing:'Transfer on its way',upcoming:'Due when you accept'},
    s2:{due:'Due Fri 23 Oct',processing:'Transfer on its way',upcoming:'When the shell is complete'},
    fin:{due:'Due Mon 16 Nov',processing:'Transfer on its way',upcoming:'After handover & sign-off'}
  };
  const it=[
    {k:'dep',n:'Deposit',sub:'20% · secures your build slot',amt:d,inv:'INV-0381'},
    {k:'s2',n:'Shell payment',sub:'50% · when the concrete shell is in',amt:s2,inv:'INV-0417'},
    {k:'fin',n:'Final balance',sub:'30% · after handover & your sign-off',amt:f,inv:'INV-0452'}
  ].map(x=>({...x,st:p[x.k],when:p[x.k]==='paid'?pd(x.k):w[x.k][p[x.k]]}));
  if(S.vr==='approved')it.push({k:'vr',n:'Variation VO-01',sub:'Drain reroute · billed with final',amt:VAR.total,inv:'INV-0453',st:p.vr,when:p.vr==='paid'?pd('vr'):{due:'Due Mon 16 Nov',processing:'Transfer on its way',upcoming:'Added to final balance'}[p.vr]});
  return it;
}
const item=k=>sched().find(x=>x.k===k);
function totals(){
  const it=sched();const all=it.reduce((a,x)=>a+x.amt,0);
  const paid=it.filter(x=>x.st==='paid').reduce((a,x)=>a+x.amt,0);
  const proc=it.filter(x=>x.st==='processing').reduce((a,x)=>a+x.amt,0);
  return {all:r2(all),paid:r2(paid),proc:r2(proc),left:r2(all-paid)};
}

let PL={temp:28.4,target:29,ph:7.4,cl:1.5,cover:true,light:'off',heat:true,kw:3.2,filter:false};
function plStep(){
  PL.heat=PL.temp<PL.target-0.05;
  const rate=PL.heat?(PL.cover?.012:.006):-(PL.cover?.003:.012);
  PL.temp=Math.max(18,Math.min(32,PL.temp+rate+(Math.random()-.5)*.004));
  PL.kw=PL.heat?3+Math.random()*.4:0;
  PL.ph=Math.max(7.2,Math.min(7.6,PL.ph+(Math.random()-.5)*.02));
  PL.cl=Math.max(1.1,Math.min(2.4,PL.cl+(Math.random()-.5)*.04));
}
function dialSVG(){
  const r=104,c=2*Math.PI*r,frac=.75,len=c*frac,v=Math.max(0,Math.min(1,(PL.temp-18)/(32-18))),t=(PL.target-18)/14;
  const ang=135+270*t,rad=ang*Math.PI/180,tx=120+r*Math.cos(rad),ty=120+r*Math.sin(rad);
  return `<svg viewBox="0 0 240 240"><defs><linearGradient id="dg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#5CE1E6"/><stop offset="1" stop-color="#FFB45C"/></linearGradient></defs>
  <circle cx="120" cy="120" r="${r}" fill="none" stroke="#E6EDEF" stroke-width="14" stroke-linecap="round" stroke-dasharray="${len} ${c}" transform="rotate(135 120 120)"/>
  <circle id="darc" cx="120" cy="120" r="${r}" fill="none" stroke="url(#dg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${len*v} ${c}" transform="rotate(135 120 120)" style="transition:stroke-dasharray 1s"/>
  <circle id="dtgt" cx="${tx}" cy="${ty}" r="9" fill="#fff" stroke="#0F4C5C" stroke-width="3"/></svg>`;
}
function controlBody(){
  const sw=[['off','Off'],['aqua','#5CE1E6'],['white','#FFF6D8'],['blue','#3D7BFF'],['violet','#B36BFF'],['party','conic-gradient(#5CE1E6,#B36BFF,#3D7BFF,#FF6FAE,#5CE1E6)']];
  return `<div class="card cardp"><div class="dial">${dialSVG()}<div class="c"><div class="tv num" id="ctemp">${PL.temp.toFixed(1)}<small>°</small></div><div class="tl">Water temperature</div><div class="tg" id="cheat">${PL.heat?'Heating · '+PL.kw.toFixed(1)+' kW':'At temperature'}</div></div></div>
  <div class="tgt"><button onclick="A.tgt(-.5)" aria-label="Cooler">−</button><div><span>Target</span><b id="ctgt">${PL.target.toFixed(1)}°C</b></div><button onclick="A.tgt(.5)" aria-label="Warmer">+</button></div>
  <div class="small muted" style="text-align:center;margin-top:10px" id="ceta">${eta()}</div></div>
  <div class="card cardp mt12"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:16px">Cover</b><div class="small muted" id="ccovs">${PL.cover?'Closed · keeping the heat in':'Open · ready to swim'}</div></div><button class="btn ${PL.cover?'p':'g'} sm" id="ccovb" onclick="A.cover()">${PL.cover?'Open cover':'Close cover'}</button></div>
  <div class="poolw" style="margin-top:12px">${poolSVG({k:'c',cover:PL.cover?1:0,light:PL.light,dims:false,id:'cp'})}</div>
  <div style="margin-top:14px"><b style="font-size:16px">Lights</b><div class="sw">${sw.map(([k,c])=>`<button class="${k==='off'?'off':''} ${PL.light===k?'on':''}" style="${k==='off'?'':`background:${c}`}" onclick="A.light('${k}')" aria-label="${k}">${k==='off'?ic('x',16,2.2):''}</button>`).join('')}</div></div></div>
  <div class="card cardp mt12"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:16px">Water quality</b><span class="pill ok">${ic('check',11,2.6)} Perfect</span></div>
  ${gauge('pH','cph',PL.ph,6.8,8,'7.2 to 7.6 is ideal')}${gauge('Chlorine','ccl',PL.cl,0,4,'1 to 3 ppm is ideal',' ppm')}
  <div class="note ok mt12">${ic('sparkle',16)}<div>Automatic dosing is on. You never need to touch a chemical, we top it up on every service visit.</div></div></div>
  <div class="card cardp mt12" style="display:flex;gap:12px;align-items:center"><div class="ic t-blue">${ic('fan',20)}</div><div style="flex:1"><div style="font-weight:600">Filter pump</div><div class="small muted">${PL.filter?'Boost running · 2 hours':'Runs 8am to 2pm and 8pm to 10pm'}</div></div><button class="btn ${PL.filter?'g':'p'} sm" onclick="A.filter()">${PL.filter?'Stop':'Boost 2h'}</button></div>
  <div class="chart mt12"><div class="hd"><b>This week</b><span class="small muted">Water temp & cost a day</span></div>${weekTemp()}<div class="lg2"><span><i style="background:#5CE1E6"></i>Cost a day</span><span><i style="background:#0F4C5C"></i>Water °C</span></div></div>
  <div class="kv mt12"><div><span>Running cost today</span><b class="num">£2.14</b><small>heat pump + filter</small></div><div><span>This month so far</span><b class="num">£19.40</b><small>on track for ~£58</small></div></div>
  <div class="promo mt12">${LOOP.replace('class="loop"','class="loop" style="right:-60px;top:-50px;width:230px;opacity:.3"')}<h4>Tip: keep the cover closed</h4><p>Closing it overnight holds onto about 70% of the heat, so the heat pump barely works and your costs stay low.</p></div>`;
}
function gauge(n,id,v,mn,mx,hint,u=''){return `<div class="gauge"><div class="gl"><span>${n}</span><b id="${id}">${v.toFixed(1)}${u}</b></div><div class="gt"><i id="${id}i" style="left:${(v-mn)/(mx-mn)*100}%"></i></div><div class="gs"><span>${mn}</span><span>${hint}</span><span>${mx}</span></div></div>`}
function eta(){if(!PL.heat)return 'Ready to swim now 🏊';const hrs=Math.max(.5,(PL.target-PL.temp)/(PL.cover?.36:.18));const d=new Date(Date.now()+hrs*3600e3);return `Reaches ${PL.target.toFixed(1)}° around ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}${PL.cover?'':' · close the cover to get there faster'}`}
function weekTemp(){
  const d=[['Fri',22.0,1.6],['Sat',25.6,3.4],['Sun',27.4,3.1],['Mon',28.1,2.2],['Tue',28.4,2.1],['Wed',0,0],['Thu',0,0]];const W=320,H=140;
  let line='';d.filter(x=>x[1]).forEach(([n,t],i)=>{const x=i*(W/7)+W/14,y=H-(t-18)/14*H;line+=(i?' L':'M')+x.toFixed(1)+' '+y.toFixed(1)});
  return `<svg viewBox="0 0 ${W} ${H+18}">${d.map(([n,t,c],i)=>{const x=i*(W/7)+10,w=W/7-20;return `<rect x="${x}" y="${H-c/4*H*.6}" width="${w}" height="${c/4*H*.6}" rx="6" fill="${c?'#5CE1E6':'#EEF3F4'}" opacity="${c?.55:1}"/>${c?`<text x="${x+w/2}" y="${H-c/4*H*.6-5}" font-size="9.5" fill="#3A474D" font-family="Figtree,-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">£${c.toFixed(2)}</text>`:''}<text x="${x+w/2}" y="${H+15}" font-size="10" fill="#74838A" font-family="Figtree,-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">${n}</text>`}).join('')}
  <path d="${line}" fill="none" stroke="#0F4C5C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${d.filter(x=>x[1]).map(([n,t],i)=>`<circle cx="${i*(W/7)+W/14}" cy="${H-(t-18)/14*H}" r="4" fill="#fff" stroke="#0F4C5C" stroke-width="2"/><text x="${i*(W/7)+W/14}" y="${H-(t-18)/14*H-9}" font-size="10" font-weight="700" fill="#151515" font-family="Figtree,-apple-system,Helvetica,Arial,sans-serif" text-anchor="middle">${t}°</text>`).join('')}</svg>`;
}
function plUpdate(){
  plStep();
  const set=(id,v)=>document.querySelectorAll(`[id="${id}"]`).forEach(e=>e.textContent=v);

const LS=[];

function openLayer(html,o={}){
  const el=document.createElement('div');el.className='layer';const type=o.type||'sheet';
  el.innerHTML=type==='sheet'?`<div class="bd" onclick="A.close()"></div><div class="sheet ${o.tall?'tall':''}">${html}</div>`:`<div class="page ${o.dark?'dark':''}">${html}</div>`;
  $('#layers').appendChild(el);
  const prev=LS[LS.length-1];if(prev&&type==='page'&&prev.type==='page')prev.el.classList.add('under');
  LS.push({el,type,dark:!!o.dark,onClose:o.onClose});
  void el.offsetWidth;requestAnimationFrame(()=>el.classList.add('in'));
  if(type==='sheet')dragify(el);
  bar();return el;
}
function closeLayer(n=1){
  for(let k=0;k<n;k++){const l=LS.pop();if(!l)break;l.el.classList.remove('in');l.el.style.pointerEvents='none';const p=LS[LS.length-1];if(p)p.el.classList.remove('under');l.onClose&&l.onClose();setTimeout(()=>l.el.remove(),480)}
  bar();
}
const closeAll=()=>closeLayer(LS.length);
const top_=()=>LS[LS.length-1]?.el;
function bar(){const t=LS[LS.length-1];$('#screen').classList.toggle('darkbar',!!(t&&t.dark))}
function dragify(el){
  const sh=el.querySelector('.sheet');let y0=null,dy=0;
  sh.querySelectorAll('.grab,.sheet-h').forEach(h=>{
    h.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;y0=e.clientY;dy=0;sh.style.transition='none';h.setPointerCapture(e.pointerId)});
    h.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`});
    const up=()=>{if(y0===null)return;y0=null;sh.style.transition='';if(dy>110){sh.style.transform='translateY(110%)';closeLayer()}else sh.style.transform=''};
    h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);
  });
}
const SH=(t,b,f='')=>`<div class="grab"></div><div class="sheet-h"><h3>${t}</h3><button class="xb" onclick="A.close()">${ic('x',15,2.4)}</button></div><div class="sheet-b" style="position:relative">${b}</div>${f?`<div class="sheet-f">${f}</div>`:''}`;

let tT;
function toast(t,s='',icn='check',tone='ok'){
  const c={ok:'#14955A',bad:'#D2463E',warn:'#C27E06',blue:'#2E6BE0',acc:'#0F4C5C',mute:'#3A3F44',mint:'#14B3BE'}[tone]||tone;

  const el=$('#toast');el.classList.remove('show');void el.offsetWidth;el.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('show'),3400);

function payFoot(amt){
  const m=S.method;
  if(m==='apple')return `<button class="btn blk" id="payBtn" onclick="A.doPay()">Pay with&nbsp;<span class="apl">Apple Pay</span></button>`;

function markPaid(its,amt,method){
  its.forEach(x=>S.pay[x.k]='paid');

  chatPush({f:'sys',t:`Payment of ${m2(amt)} received · thank you`},true);

function paySuccess(its,amt,method){
  const el=top_();if(!el)return;const bank=method==='Bank transfer';let r=null;

    setTimeout(()=>{if(its.every(x=>S.pay[x.k]==='processing')){markPaid(its,amt,'Bank transfer');render();toast('Transfer received',`${m2(amt)} has landed, thank you`,'bank','ok')}},8000);}
  else r=markPaid(its,amt,method);
  const dep=its.some(x=>x.k==='dep')&&S.stage==='quote';
  const fin=its.some(x=>x.k==='fin');

  <div class="summ mt20">${[['Amount',m2(amt)],['Paid to','Tidewell Pools'],['Method',method==='Pay in 3'?'Pay in 3 · '+m2(r2(amt/3))+' today':method],['Reference',r?r.ref:JOB],['Date',today()]].map(([a,b])=>`<div class="l"><span>${a}</span><b>${b}</b></div>`).join('')}</div>`;
  el.querySelector('.sheet-f').innerHTML=dep?`<button class="btn p" onclick="A.close();setTimeout(()=>A.book('start'),300)">${ic('cal',18)} Choose your dig day</button>`
    :fin?`<div class="btns2"><button class="btn g" onclick="A.close();setTimeout(()=>A.doc('rc:${S.receipts.length-1}'),300)">Receipt</button><button class="btn p" onclick="A.close();setTimeout(A.review,300)">${ic('star',17)} Rate us</button></div>`
    :`<div class="btns2"><button class="btn g" ${r?`onclick="A.close();setTimeout(()=>A.doc('rc:${S.receipts.length-1}'),300)"`:'disabled'}>View receipt</button><button class="btn p" onclick="A.close()">Done</button></div>`;
  render();

let SIG={ink:false};
A.sign=ctx=>{
  let sum,agree,btn,title;
  if(ctx==='quote'){const ad=ADDONS.filter(a=>S.addons[a.k]);title='Accept your pool design';agree='I accept proposal P-0217 and agree to the contract terms.';btn='Sign & accept';

  if(ctx==='vo'){title='Approve variation VO-01';agree='I approve the drain reroute at £1,380.00 inc VAT, added to my final balance.';btn='Sign & approve';
    sum=`<div class="summ"><div class="l"><span>Work</span><b>Reroute old drain</b></div><div class="l"><span>When</span><b>Today, by Ryan</b></div><div class="l"><span>Shell pour</span><b style="color:var(--ok)">Still tomorrow</b></div><div class="l tot"><span>Cost inc VAT</span><span>£1,380.00</span></div></div>`}
  if(ctx==='off'){title='Sign off your pool';agree=S.snags.length?`I confirm the pool is complete, subject to ${S.snags.length} snag${S.snags.length>1?'s':''} being fixed.`:'I confirm my pool is built, working and explained to me.';btn='Sign off & register guarantees';
    sum=`<div class="summ"><div class="l"><span>Checks completed</span><b>${Object.values(S.offChecks).filter(Boolean).length} of 6</b></div><div class="l"><span>Snags</span><b>${S.snags.length||'None'}</b></div><div class="l"><span>Unlocks</span><b>25-year shell guarantee</b></div><div class="l tot"><span>Final balance</span><span class="num">${m2(item('fin').amt+VAR.total)}</span></div></div>`}
  openLayer(SH(title,`${sum}<div style="display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px"><span class="lbl">Your signature</span><button class="small" style="color:var(--acc);font-weight:600" onclick="A.sigType()">Type it instead</button></div>
  <div class="sig"><canvas id="sigc"></canvas><div class="line"></div><span class="x">×</span><div class="hint" id="sigh">Sign here with your finger</div><button class="clr" onclick="A.sigClear()">Clear</button><div class="nm">${CU.name} · ${today()}</div></div>
  <button class="check" id="agr" style="padding:16px 4px 0" onclick="this.classList.toggle('on');A.sigCheck()"><span class="cb">${ic('check',14,3)}</span><div class="tx"><div style="font-size:14px;line-height:1.45">${agree}</div></div></button>
  <div class="small muted" style="padding:14px 4px 0;display:flex;gap:7px;line-height:1.45">${ic('lock',14)}<span>Legally binding e-signature. Date, time and device are recorded and a signed copy goes to your documents.</span></div>`,`<button class="btn p" id="sigb" disabled onclick="A.signDone('${ctx}')">${btn}</button>`));
  setTimeout(initSig,80);
};
function initSig(){
  const c=$('#sigc');if(!c)return;const w=c.offsetWidth,h=c.offsetHeight;c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.scale(2,2);x.lineCap='round';x.lineJoin='round';x.strokeStyle='#151515';SIG={ink:false,c,x,w,h};let dn=false,lp=null;
  const pos=e=>{const b=c.getBoundingClientRect();return{x:(e.clientX-b.left)*w/b.width,y:(e.clientY-b.top)*h/b.height,t:performance.now()}};
  c.onpointerdown=e=>{dn=true;lp=pos(e);c.setPointerCapture(e.pointerId);$('#sigh').style.opacity=0};
  c.onpointermove=e=>{if(!dn)return;const p=pos(e),d=Math.hypot(p.x-lp.x,p.y-lp.y),v=d/Math.max(1,p.t-lp.t);x.lineWidth=Math.max(1.3,3.3-v*1.1);x.beginPath();x.moveTo(lp.x,lp.y);x.lineTo(p.x,p.y);x.stroke();lp=p;if(d>0&&!SIG.ink){SIG.ink=true;A.sigCheck()}};
  c.onpointerup=c.onpointercancel=()=>dn=false;
}
A.sigClear=()=>{if(SIG.x)SIG.x.clearRect(0,0,SIG.w,SIG.h);SIG.ink=false;$('#sigh').style.opacity=1;A.sigCheck()};
A.sigType=()=>{if(!SIG.x)return;A.sigClear();SIG.x.font='italic 500 34px Figtree, sans-serif';SIG.x.fillStyle='#1B3A6B';SIG.x.fillText(CU.name,26,SIG.h-52);SIG.ink=true;$('#sigh').style.opacity=0;A.sigCheck()};
A.sigCheck=()=>{const b=$('#sigb'),g=$('#agr');if(b)b.disabled=!(SIG.ink&&g&&g.classList.contains('on'))};
A.signDone=ctx=>{

    if(ctx==='vo'){S.vr='approved';S.sigVo=data;closeLayer(2);
      notify({ic:'check',tone:'ok',t:'Variation approved',s:'VO-01 · £1,380 added to final balance',go:"A.doc('vo')"});
      chatPush({f:'them',who:'Ryan',t:"Thanks Olivia. Rerouting the drain this afternoon, shell pour still on for 8am tomorrow 👍"});
      render();toast('Variation approved','Drain rerouted today, pour still tomorrow','check','ok');}
    if(ctx==='off'){S.signed=true;S.sigOff=data;S.pay.fin='due';S.pay.vr='due';closeLayer(2);
      notify({ic:'shield',tone:'ok',t:'Guarantees registered',s:'25-year shell guarantee · every warranty in your name',go:"A.doc('war')"});
      chatPush({f:'them',who:'Priya',t:"All done Olivia! Your 25-year shell guarantee and every equipment warranty are registered. You'll find them in Documents. Enjoy every swim."});
      render();setTimeout(()=>successSheet({seal:1,h:"Your pool is guaranteed",p:'Your 25-year shell guarantee is insurance-backed and every warranty is now registered in your name.',rows:[['Shell guarantee','25 years · TW-G-0217'],['Heat pump','5 years'],['Cover & motor','5 years'],['Final balance',m2(item('fin').amt+VAR.total)+(S.autopay?' · auto-pay on':' · due 16 Nov')]],btn:S.autopay?['View guarantees',"A.close();setTimeout(()=>A.doc('war'),300)"]:['Pay final balance',"A.close();setTimeout(()=>A.pay(['fin','vr']),300)"],btn2:S.autopay?null:['View guarantees',"A.close();setTimeout(()=>A.doc('war'),300)"]}),380);}
  },900);
};

/* profile */
A.profile=()=>{
  const faqs=[['When do I pay?',"20% when you accept, 50% once the concrete shell is in, and the last 30% only after handover and your sign-off. You never pay ahead of the work."],['Do I need planning permission?','Most garden pools are permitted development. We apply for a Lawful Development Certificate from your council so it is officially confirmed, which also helps if you ever sell.'],['What happens to my lawn?','We lay ground mats for the digger and lorries, and re-turf anything we disturb. Most gardens look better than before within a few weeks.'],['What does it cost to run?','With a heat pump and automatic cover, most of our 10 × 4 m pools cost £400 to £700 a year to heat for a summer season.'],['What if something goes wrong?','Tap Report an issue and send a photo. We can see your pool controller remotely, so most things are fixed without a visit.']];
  openLayer(SH('Account',`<div style="display:flex;flex-direction:column;align-items:center;padding:4px 0 18px"><span class="av me" style="width:78px;height:78px;font-size:26px">${CU.ini}</span><div style="font-size:21px;font-weight:700;letter-spacing:-.025em;margin-top:10px">${CU.name}</div><div class="small muted">${CU.email} · ${CU.tel}</div></div>
  <div class="lbl" style="margin:0 4px 8px">Your home</div><div class="list"><div class="row"><div class="ic t-acc">${ic('home',18)}</div><div class="tx"><div class="t">${CU.a1}</div><div class="s">${CU.a2}</div></div></div><div class="row"><div class="ic t-mute">${ic('swim',18)}</div><div class="tx"><div class="t">Job ${JOB}</div><div class="s">${OPTS[S.stage==='quote'?S.quoteOpt:'better'].n} pool · ${OPTS[S.stage==='quote'?S.quoteOpt:'better'].size}</div></div></div></div>
  <div class="lbl" style="margin:20px 4px 8px">Access notes</div><div class="field"><label>Seen by the whole crew before they arrive</label><textarea rows="3" oninput="S.notes=this.value">${esc(S.notes)}</textarea></div>
  <div class="lbl" style="margin:20px 4px 8px">How we keep you updated</div><div class="list">${[['push','bell','Push notifications'],['wa','whats','WhatsApp'],['sms','chat','Text messages'],['email','file','Email']].map(([k,i,t])=>`<div class="row"><div class="ic sm t-mute">${ic(i,16)}</div><div class="tx"><div class="t">${t}</div></div><button class="tog ${S.prefs[k]?'on':''}" onclick="A.setPref('${k}',this)"></button></div>`).join('')}</div>
  <div class="lbl" style="margin:20px 4px 8px">Help</div><div class="list">${faqs.map(([q,a])=>`<div class="acc-i"><button onclick="this.parentElement.classList.toggle('open')">${q}<span style="color:#C4C6C8;transition:transform .2s">${ic('cr',16)}</span></button><div class="a">${a}</div></div>`).join('')}</div>
  <div class="list mt12"><button class="row" onclick="A.whats()"><div class="ic sm t-ok">${ic('whats',16)}</div><div class="tx"><div class="t">WhatsApp the team</div><div class="s">${CO.wa}</div></div></button><button class="row" onclick="A.call()"><div class="ic sm t-ok">${ic('phone',16)}</div><div class="tx"><div class="t">Call the office</div><div class="s">${CO.phone} · Mon to Sat, 8 to 6</div></div></button><button class="row" onclick="A.close();setTimeout(A.report,260)"><div class="ic sm t-warn">${ic('wrench',16)}</div><div class="tx"><div class="t">Report an issue</div><div class="s">Covered by your guarantees</div></div></button><button class="row" onclick="A.close();setTimeout(A.refer,260)"><div class="ic sm t-acc">${ic('gift',16)}</div><div class="tx"><div class="t">Refer a friend</div><div class="s">Give £500, get £500</div></div></button></div>
  <button class="btn g mt16" onclick="A.restart()">${ic('out',18)} Sign out</button>
  <div class="small muted" style="text-align:center;margin-top:14px">${CO.legal} · ${CO.reg}</div>`),{tall:true});
};

/* ---------- system design ---------- */
A.design=()=>{
  const k=S.stage==='quote'?S.quoteOpt:'better',o=OPTS[k];
  openLayer(PG('Your pool design',`<div style="padding:16px 16px 28px"><div class="card cardp"><div class="poolw">${poolSVG({k:'dz',size:k,light:'aqua'})}</div>
  <div class="spec"><div><span>Size</span><b>${o.size}</b></div><div><span>Depth</span><b>${k==='essential'?'1.2 to 1.5 m':'1.2 to 1.8 m'}</b></div><div><span>Water</span><b>${k==='best'?'64,000':k==='essential'?'38,000':'54,000'} litres</b></div><div><span>Heating</span><b>Air source heat pump</b></div></div></div>
  <div class="lbl" style="margin:22px 4px 10px">Built in layers</div><div class="list flat">${[['digger','Dug & levelled','To 1.8 m, spoil taken away'],['layers','Steel cage','Reinforced floor and walls'],['drop','Concrete shell','Sprayed in one continuous pour'],['sparkle',k==='essential'?'Reinforced liner':'Porcelain mosaic','Smooth, frost-proof finish'],['cover',k==='essential'?'Safety cover':'Automatic slatted cover','Keeps heat in and leaves out']].map(([i,t,s])=>`<div class="row"><div class="ic sm t-acc">${ic(i,16)}</div><div class="tx"><div class="t">${t}</div><div class="s">${s}</div></div></div>`).join('')}</div>
  <div class="lbl" style="margin:22px 4px 10px">Why we designed it this way</div><div class="list flat">${['Placed where the afternoon sun lands, so the water warms for free','Shallow end by the house for the kids, deep end for diving','Plant room tucked behind the shed, out of sight and earshot','Terrace on the sunny side for loungers'].map(t=>`<div class="row" style="padding:12px 16px"><span style="color:var(--brand)">${ic('check',18,2.2)}</span><div class="tx" style="font-size:14.5px">${t}</div></div>`).join('')}</div>
  <div class="note blue mt12">${ic('info',16)}<div>Want to see one in real life? Tom can take you to a pool we built nearby. Just ask in Messages.</div></div></div>`,{acts:`<button onclick="A.doc('survey')">${ic('file',20)}</button>`}),{type:'page'});
};

/* ---------- DNO tracker ---------- */
A.dno=()=>{
  const ok=S.stage!=='quote';
  const steps=[['Application sent to Elmbridge','19 Aug · plans, sections and site photos',1],['Council review','Planning officer checks it meets permitted development',ok?1:.5],['Certificate granted','29 Sep · your pool is officially permitted',ok],['Kept in your documents','Useful when you sell your home',ok]];
  openLayer(SH('Council certificate (LDC)',`<div class="card cardp" style="display:flex;gap:14px;align-items:center"><div class="ic t-blue" style="width:52px;height:52px;border-radius:16px">${ic('house2',26)}</div><div><div style="font-weight:700;font-size:16px">${ok?'Granted':'In review'} · Elmbridge Borough Council</div><div class="small muted">Reference 2026/2184/LDC</div></div></div>
  <div class="card mt12" style="padding:6px 0">${steps.map(([t,s,d])=>`<div class="tli ${d===1||d===true?'d':d?'c':'u'}" style="cursor:default"><div class="rail"><div class="nd">${ic('check',13,3)}</div><div class="ln"></div></div><div class="bd"><div class="t"><span>${t}</span></div><div class="dt">${s}</div></div></div>`).join('')}</div>
  <div class="note ok mt12">${ic('info',16)}<div>Most garden pools don't need full planning permission, but a certificate makes it official. We do the drawings, forms and chasing.</div></div>`,ok?`<button class="btn p" onclick="A.close();setTimeout(()=>A.doc('ldc'),300)">View certificate</button>`:''));
};

/* ---------- quote ---------- */
A.quote=()=>openLayer(PG('Your pool design',`<div id="qb">${quoteBody()}</div>`,{acts:`<button onclick="A.doc('quote')">${ic('file',20)}</button>`,foot:`<div id="qf">${quoteFoot()}</div>`}),{type:'page'});
function quoteBody(){
  const sg=S.quoteSigned;
  return `<div style="position:relative;height:210px;background:var(--brand);overflow:hidden">${ph(P.garden,'','style="position:absolute;inset:0"')}<div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,48,58,.1) 20%,rgba(8,48,58,.92))"></div>${LOOP.replace('class="loop"','class="loop" style="right:-60px;top:-50px;width:250px;opacity:.45"')}<div style="position:absolute;left:18px;right:18px;bottom:16px;color:#fff"><span class="pill ${sg?'mint':'dark'}">${sg?ic('check',12,2.4)+' Accepted':ic('clock',12,2)+' Build slot held until 21 Aug'}</span><div style="font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:9px">A pool for ${CU.a1}</div><div style="font-size:13px;opacity:.75">P-0217 · designed by Tom · 11 Aug</div></div></div>
  <div style="padding:16px 16px 24px">
  <button class="card" style="display:flex;gap:12px;align-items:center;padding:12px;width:100%;text-align:left" onclick="A.story(0)"><div style="width:54px;height:54px;border-radius:14px;display:grid;place-items:center;color:#5CE1E6;background:radial-gradient(circle at 70% 20%,#1A7487,#0A3742);flex-shrink:0">${ic('play',18)}</div><div style="flex:1"><div style="font-weight:600;font-size:14.5px">Your garden, explained</div><div class="small muted">5 things we found · 1 minute</div></div><span style="color:#C4C6C8">${ic('cr',18)}</span></button>
  <div class="lbl" style="margin:24px 4px 12px">1 · Choose your pool</div>
  ${Object.entries(OPTS).map(([k,o])=>`<button class="qopt ${S.quoteOpt===k?'on':''}" ${sg?'':`onclick="A.qOpt('${k}')"`} style="${o.badge?'margin-top:18px':''}">${o.badge?`<span class="pill badge mint">${o.badge}</span>`:''}<div class="top"><div><h4>${o.n}</h4><p>${o.desc}</p></div><div class="pr num">${money(o.price)}<small>inc VAT</small></div></div><ul>${o.inc.map(x=>`<li>${ic('check',15,2.6)}<span>${x}</span></li>`).join('')}</ul><div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><span class="pill acc">${o.size}</span><span class="pill mute">~${money(o.run*6+150)} a year to run</span><span class="pill mute">${k==='best'?'6':'5'} week build</span></div></button>`).join('')}
  <div class="lbl" style="margin:24px 4px 12px">2 · Add extras</div>
  <div class="list">${ADDONS.map(a=>`<div class="addon"><div class="tx"><div class="t">${a.n}</div><div class="s">${a.s}</div></div><span class="p num">+${money(a.p)}</span><button class="tog ${S.addons[a.k]?'on':''}" ${sg?'style="opacity:.5"':`onclick="A.qAdd('${a.k}')"`}></button></div>`).join('')}</div>
  <div class="note blue mt12">${ic('info',16)}<div>Extras cost much less now than later, because the digger and the crew are already in your garden.</div></div>
  <div class="lbl" style="margin:24px 4px 12px">3 · How you'll pay</div>
  <div class="summ">${sched().filter(x=>x.k!=='vr').map(x=>`<div class="l"><span>${x.n} · ${x.sub.split(' · ')[0]}</span><b class="num">${m2(x.amt)}</b></div>`).join('')}<div class="l tot"><span>Total inc VAT</span><span class="num">${m2(quoteTotal())}</span></div></div>
  <div class="note ok mt12">${ic('shield',16)}<div>Your deposit is protected and you never pay ahead of the work. Council certificate, spoil removal and pool school are all included.</div></div>
  <div class="small muted" style="padding:14px 4px 0;line-height:1.5">Fixed price including VAT. Running costs are estimates. Valid until 21 Aug 2026. Read the full <span style="color:var(--acc);font-weight:600;cursor:pointer" onclick="A.doc('contract')">terms & conditions</span>.</div></div>`;
}
function quoteFoot(){
  if(S.quoteSigned)return `<button class="btn ok" onclick="A.doc('quote')">${ic('check',18,2.4)} Accepted · view signed proposal</button>`;
  const n=Object.values(S.addons).filter(Boolean).length;
  return `<div class="qbar"><div class="tx"><span>${OPTS[S.quoteOpt].n}${n?` + ${n} extra${n>1?'s':''}`:''}</span><b class="num">${money(quoteTotal())}</b></div><button class="btn p" style="width:auto;padding:0 22px" onclick="A.sign('quote')">${ic('pen',17)} Accept & sign</button></div>`;
}
A.qOpt=k=>{S.quoteOpt=k;refreshQuote()};
A.qAdd=k=>{S.addons[k]=!S.addons[k];refreshQuote()};
function refreshQuote(){const el=top_();if(!el)return;const b=el.querySelector('.page-b'),y=b.scrollTop;el.querySelector('#qb').innerHTML=quoteBody();el.querySelector('#qf').innerHTML=quoteFoot();b.scrollTop=y;render()}

/* ---------- variation ---------- */
A.variation=()=>openLayer(PG('Variation VO-01',varBody(),{acts:`<button onclick="A.doc('vo')">${ic('file',20)}</button>`,foot:varFoot()}),{type:'page'});
function varBody(){
  const st={pending:['warn','Awaiting your approval'],approved:['ok','Approved by you']}[S.vr];
  return `<div style="height:200px">${ph(P.dig2,'','style="height:100%" onclick="A.gal(1)"')}</div><div style="padding:18px 16px 24px"><div class="card cardp" style="display:flex;gap:14px;align-items:center">${av(TEAM.callum,'lg')}<div><div style="font-weight:700">Raised by Callum</div><div class="small muted">Site manager · today 13:44</div></div></div>
  <div style="margin-top:16px"><span class="pill ${st[0]}">${st[1]}</span></div><div style="font-size:25px;font-weight:700;letter-spacing:-.03em;margin-top:10px;line-height:1.2">An old drain runs under the deep end</div>
  ${S.vr==='pending'?`<div class="note warn mt16">${ic('clock',16)}<div><b>Approve by 4pm</b> and Ryan reroutes it this afternoon, so the shell still goes in tomorrow.</div></div>`:''}
  <div class="lbl" style="margin:22px 4px 8px">What we found</div><div class="card cardp" style="font-size:14.5px;line-height:1.55;color:var(--ink2)">The clay drain our survey camera spotted runs right under where the deep end sits. It still carries water from your gutters, so it can't just be cut. We said we'd only reroute it if we had to, and we do.</div>
  <div class="lbl" style="margin:22px 4px 8px">What we'll do</div><div class="list flat">${['Reroute 9 m of drain around the pool in new plastic pipe','Add an inspection chamber so it can always be checked','Camera-test it before we backfill','Photograph every step for your records'].map(t=>`<div class="row" style="padding:12px 16px"><span style="color:var(--brand)">${ic('check',18,2.2)}</span><div class="tx" style="font-size:14.5px">${t}</div></div>`).join('')}</div>
  <div class="lbl" style="margin:22px 4px 8px">Cost</div><div class="summ">${VAR.lines.map(([a,b])=>`<div class="l"><span>${a}</span><b class="num">${m2(b)}</b></div>`).join('')}<div class="l"><span>VAT @ 20%</span><b class="num">£230.00</b></div><div class="l tot"><span>Total</span><span class="num">£1,380.00</span></div></div>
  <div class="note blue mt12">${ic('info',16)}<div>Nothing to pay today. It's added to your final balance, after you've signed everything off.</div></div></div>`;
}
function varFoot(){
  return S.vr==='pending'?`<div class="btns2"><button class="btn g" onclick="A.varAsk()">Ask a question</button><button class="btn p" onclick="A.sign('vo')">${ic('pen',17)} Approve</button></div>`
  :`<button class="btn ok" onclick="A.doc('vo')">${ic('check',18,2.4)} Approved · view signed copy</button>`;
}
A.varAsk=()=>{A.tab('chat');setTimeout(()=>{const i=$('#cin');if(i){i.value='Question about the drain: ';i.focus()}},400)};

/* ---------- wifi / access ---------- */
A.access=()=>openLayer(SH('Connect your pool',`<div class="card" style="padding:16px;display:flex;gap:14px;align-items:center"><div class="ic t-blue" style="width:52px;height:52px;border-radius:16px">${ic('wifi',26)}</div><div><div style="font-weight:700;font-size:16px">Heat your pool from the sofa</div><div class="small muted">Callum connects your pool controller at handover</div></div></div>
  <div class="field mt16"><label>Wi-Fi network name</label><input value="Bennett-Home"></div><div class="field"><label>Wi-Fi password</label><input type="password" value="elmgrove2026"></div>
  <div class="lbl" style="margin:18px 4px 10px">Does your Wi-Fi reach the end of the garden?</div>
  ${[['Yes, signal is good',''],['Not sure','We\'ll test it on handover day'],['No, it drops out','We\'ll fit an outdoor booster at no cost']].map(([t,s],i)=>`<button class="opt ${i?'':'on'}" onclick="this.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));this.classList.add('on')"><div class="tx"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div><span class="rd"></span></button>`).join('')}
  <div class="small muted" style="display:flex;gap:7px;padding:14px 4px 0">${ic('lock',14)} Encrypted, only visible to Callum on handover day, deleted afterwards.</div>`,`<button class="btn p" onclick="A._accOk()">Save securely</button>`));
A._accOk=()=>{S.access=true;closeLayer();render();toast('Wi-Fi saved','Callum will connect your pool at handover','wifi','ok');notify({ic:'wifi',tone:'ok',t:'Wi-Fi details saved',s:'Encrypted and shared with Callum only'})};

/* ---------- booking calendar ---------- */
let BK={};
A.book=kind=>{BK={kind,sel:null,slot:null};const t={start:'Choose your dig day',walk:'Book your pool school',hp:'Book a pool house design visit',svc:'Book your first service visit'}[kind];openLayer(SH(t,`<div id="bkb">${bkBody()}</div>`,`<button class="btn p" id="bkbtn" disabled onclick="A._bkOk()">Confirm</button>`),{tall:true})};
function bkBody(){
  const k=BK.kind,mon=k==='start'?'October':'November',first=k==='start'?3:6,av=k==='start'?[5,12,19,26]:k==='walk'?[6]:k==='svc'?[19,20,23,24]:[12,13,17,19,20,24],slots=['09:00','10:30','12:00','14:00','15:30','17:00'],taken={6:['09:00','10:30'],12:['10:30'],19:['12:00'],17:['14:00']};
  const intro={start:'Dates with a green dot have Callum and Ryan free for a full 5-week build. Your council certificate is usually through well before then.',walk:'Callum shows you how everything works: heating, cover, lights, the app and the water chemistry. About an hour, kids welcome.',hp:'Tom pops round to measure up and sketch a pool house that matches your pool. Free, no pressure.',svc:'Your first service visit is free. We check the water, clean the filter and answer any questions.'}[k];
  const days=k==='start'?31:30;
  return `<p class="small muted" style="margin:-2px 4px 14px;line-height:1.5">${intro}</p>
  <div class="cal"><div class="mh"><span>${mon} 2026</span><span class="small muted" style="font-weight:400">${av.length} date${av.length===1?"":"s"} free</span></div><div class="gr">${['M','T','W','T','F','S','S'].map(d=>`<div class="dn">${d}</div>`).join('')}${'<div></div>'.repeat(first)}${Array.from({length:days},(_,i)=>i+1).map(d=>`<div class="d ${av.includes(d)?'av':''} ${BK.sel===d?'sel':''}" ${av.includes(d)?`onclick="A._pick(${d})"`:''}>${d}</div>`).join('')}</div></div>
  ${k!=='start'&&BK.sel?`<div class="lbl" style="margin:20px 4px 10px">${dname(BK.sel)} · choose a time</div><div class="slots">${slots.map(t=>`<button class="${BK.slot===t?'on':''}" ${(taken[BK.sel]||[]).includes(t)?'disabled':''} onclick="A._slot('${t}')">${t}</button>`).join('')}</div>`:''}
  ${k==='start'&&BK.sel?`<div class="summ mt16"><div class="l"><span>Dig day</span><b>${dname(BK.sel)} · 7:45</b></div><div class="l"><span>Swimming by</span><b>About 5 weeks later</b></div><div class="l"><span>Your crew</span><b>Callum & Ryan</b></div></div><div class="note ok mt12">${ic('cloud',16)}<div>If heavy rain makes the ground unsafe to dig, we move by a day or two and tell you at least 48 hours before.</div></div>`:''}`;
}
function dname(d){const k=BK.kind;const dt=new Date(2026,k==='start'?9:10,d);return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]+' '+d+(k==='start'?' Oct':' Nov')}
A._pick=d=>{BK.sel=d;BK.slot=null;$('#bkb').innerHTML=bkBody();$('#bkbtn').disabled=BK.kind!=='start'};
A._slot=t=>{BK.slot=t;$('#bkb').innerHTML=bkBody();$('#bkbtn').disabled=false};
A._bkOk=()=>{
  const d=dname(BK.sel);closeLayer();
  if(BK.kind==='start'){S.startDate=d;chatPush({f:'them',who:'Tom',t:`You're in the diary for ${d}, Olivia 🙌 Callum will message the week before. There's a short checklist on your Home screen to help you get ready.`});notify({ic:'cal',tone:'ok',t:"You're booked in",s:`Digging from ${d} · 7:45am`});render();toast("You're booked in",`Dig day ${d} · added to your calendar`,'cal','ok')}
  else if(BK.kind==='walk'){S.walk=`${d} · ${BK.slot}`;notify({ic:'swim',tone:'ok',t:'Pool school booked',s:S.walk});render();toast('Pool school booked',`${S.walk} with Callum`,'cal','ok')}
  else if(BK.kind==='svc'){S.school=`${d} · ${BK.slot}`;notify({ic:'cal',tone:'ok',t:'Service visit booked',s:S.school});render();toast('Service visit booked',S.school,'cal','ok')}
  else{S.house=`${d} · ${BK.slot}`;notify({ic:'house2',tone:'ok',t:'Design visit booked',s:S.house});chatPush({f:'them',who:'Tom',t:`Looking forward to it Olivia. I'll bring some pool house ideas that suit your garden.`});render();toast('Design visit booked',`${S.house} with Tom`,'cal','ok')}
};

/* ---------- live tracking ---------- */
let TRK;
A.track=()=>{
  openLayer(SH('Live tracking',`<div class="map">${bigMap()}<span class="pill" style="position:absolute;left:12px;top:12px;background:#fff;color:var(--ink);box-shadow:var(--sh)"><span class="live" style="background:var(--ok)"></span>Live</span></div>
  <div class="card eta mt12"><div><div class="small muted">Arriving in</div><div class="big num" id="eta">9 min</div></div><div style="flex:1;text-align:right"><div style="font-weight:600">Steel delivery</div><div class="small muted">Wall bars & spacers · flatbed lorry</div></div></div>
  <div class="list mt12"><div class="row"><div class="ic sm t-ok">${ic('check',16,2.4)}</div><div class="tx"><div class="t">Left the yard</div><div class="s">13:58 · Chertsey</div></div></div><div class="row"><div class="ic sm t-blue">${ic('truck',16)}</div><div class="tx"><div class="t" id="tst">On the A317</div><div class="s">Position updates every few seconds</div></div></div><div class="row"><div class="ic sm t-mute">${ic('pin',16)}</div><div class="tx"><div class="t">${CU.a1}</div><div class="s">Ryan will sign for it and unload</div></div></div></div>
  <div class="note warn mt12">${ic('info',16)}<div>Please keep the drive clear for about 15 minutes while it's unloaded.</div></div>`,`<div class="btns2"><button class="btn g" onclick="A.call()">${ic('phone',17)} Call us</button><button class="btn p" onclick="A.tab('chat')">${ic('chat',17)} Message</button></div>`),{tall:true,onClose:()=>clearInterval(TRK)});
  let m=9;clearInterval(TRK);TRK=setInterval(()=>{m--;const e=$('#eta');if(!e){clearInterval(TRK);return}
    if(m<=0){e.textContent='Arrived';$('#tst').textContent='Arrived at your home';clearInterval(TRK);toast('Steel has arrived','Ryan is unloading it now','truck','blue')}
    else{e.textContent=m+' min';if(m===5)$('#tst').textContent='On Queens Road';if(m===2)$('#tst').textContent='Turning onto Elm Grove'}},3000);
};
function bigMap(){
  const route='M-10 214 C70 206 118 170 168 152 L246 128 L246 66 L300 66';
  return `<svg viewBox="0 0 358 270" preserveAspectRatio="xMidYMid slice" width="100%" height="100%"><rect width="358" height="270" fill="#ECF0EF"/>
